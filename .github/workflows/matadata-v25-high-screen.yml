name: MATADATA V2.5 High Resolution Screen Snapshot

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: matadata-v25-high-screen
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.head_ref == 'agent/matadata-openai-pathfinder-v2-2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '30239642524'
    steps:
      - uses: actions/checkout@v4

      - name: Download live-session handoff and fetch high-resolution screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v25-session /tmp/v25-screen
          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "matadata-pathfinder-v25-live-session") | .id' | head -n1)"
          test -n "$artifact_id"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/v25-session/session.zip
          unzip -q /tmp/v25-session/session.zip -d /tmp/v25-session/content
          python - <<'PY' > /tmp/v25-session/url.txt
          import json
          from pathlib import Path
          file = next(iter(Path('/tmp/v25-session/content').rglob('*.json')))
          payload = json.loads(file.read_text(encoding='utf-8'))
          print(payload.get('primary_url') or payload.get('url') or payload.get('primaryUrl'))
          PY
          url="$(cat /tmp/v25-session/url.txt)"
          base="${url%%\?*}"
          curl --fail --location --silent --show-error --max-time 25 \
            --cookie-jar /tmp/v25-session/cookies.txt \
            --cookie /tmp/v25-session/cookies.txt \
            "$url" > /tmp/v25-session/page.html
          curl --fail --location --silent --show-error --max-time 25 \
            --cookie /tmp/v25-session/cookies.txt \
            "${base%/}/screen?profile=high" > /tmp/v25-screen/screen-high.png
          curl --fail --location --silent --show-error --max-time 25 \
            --cookie /tmp/v25-session/cookies.txt \
            "${base%/}/status" > /tmp/v25-screen/status.json
          file /tmp/v25-screen/screen-high.png

      - name: Upload private diagnostic screen
        uses: actions/upload-artifact@v4
        with:
          name: matadata-v25-high-screen
          path: /tmp/v25-screen
          if-no-files-found: error
          retention-days: 1
