name: MATADATA OpenAI Form Pathfinder V2.6

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      mode:
        description: Run offline preflight only, or start the explicitly authorized live session.
        required: true
        default: preflight
        type: choice
        options: [preflight, submit]
      authorization_phrase:
        description: For submit mode use JP-AUTHORIZED-ONE-SUBMIT:<exact commit SHA>.
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: matadata-openai-cybersecurity-grant-v26-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  RUNNER_SHA256: f65082e4e6578558ba592103f4c86ed1ca702c512ff8e93e3a1466c893372ced
  RUNNER_GZIP_SHA256: 83c63f380a4b4f6a464046ac75afb5bcc1e1d9b8050d7f729d2dac23972f6fcb
  APPLICATION_SHA256: 54a4f19763f3d5ac2cbddc57d946f30fe4a7cd3938908c570443c5996120812a
  SUBMISSION_ID: matadata-openai-cybersecurity-grant-v1
  LOCK_ARTIFACT_NAME: matadata-openai-submission-lock-v1

jobs:
  preflight:
    name: Offline V2.6 Marketo-readiness recovery preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the staged Pathfinder branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure patch utility is available
        shell: bash
        run: command -v patch || (sudo apt-get update -qq && sudo apt-get install -y patch)

      - name: Materialize the checksum-locked V2.6 runner package in this isolated job
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pathfinder-preflight
          python -u tools/matadata-pathfinder/v26/upgrade.py \
            | tee pathfinder-preflight/v26-materialization.log

      - name: Verify the materialized V2.6 archive and immutable runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matadata-v26
          {
            echo 'MATADATA Pathfinder V2.6 package diagnostics'
            echo "commit=$GITHUB_SHA"
            echo 'package part sizes:'
            wc -c tools/matadata-pathfinder/v22/package.part.*
            echo 'package part sha256:'
            sha256sum tools/matadata-pathfinder/v22/package.part.*
          } | tee pathfinder-preflight/package-diagnostics.txt
          cat tools/matadata-pathfinder/v22/package.part.* > /tmp/matadata-v26/package.tar.gz
          {
            echo -n 'materialized_package_sha256='
            sha256sum /tmp/matadata-v26/package.tar.gz | awk '{print $1}'
            echo -n 'materialized_package_bytes='
            wc -c < /tmp/matadata-v26/package.tar.gz
            echo 'archive listing:'
            tar -tzf /tmp/matadata-v26/package.tar.gz
          } | tee -a pathfinder-preflight/package-diagnostics.txt
          gzip --test /tmp/matadata-v26/package.tar.gz
          tar -xzf /tmp/matadata-v26/package.tar.gz -C /tmp/matadata-v26
          echo "$RUNNER_GZIP_SHA256  /tmp/matadata-v26/runner.cjs.gz" | sha256sum --check
          gzip --test /tmp/matadata-v26/runner.cjs.gz
          gzip --decompress --stdout /tmp/matadata-v26/runner.cjs.gz > /tmp/matadata-v26/runner.cjs
          echo "$RUNNER_SHA256  /tmp/matadata-v26/runner.cjs" | sha256sum --check
          node --check /tmp/matadata-v26/runner.cjs
          bash /tmp/matadata-v26/scripts/preflight.sh "$GITHUB_WORKSPACE/pathfinder-preflight"

      - name: Verify V2.6 safeguards and unchanged application content
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          receipt = json.loads(Path('tools/matadata-pathfinder/v22/V26_UPGRADE_RECEIPT.json').read_text(encoding='utf-8'))
          expected = {
              'runnerVersion': '2.6.0',
              'runnerSha256': 'f65082e4e6578558ba592103f4c86ed1ca702c512ff8e93e3a1466c893372ced',
              'runnerGzipSha256': '83c63f380a4b4f6a464046ac75afb5bcc1e1d9b8050d7f729d2dac23972f6fcb',
              'applicationSha256': '54a4f19763f3d5ac2cbddc57d946f30fe4a7cd3938908c570443c5996120812a',
          }
          for key, value in expected.items():
              if receipt.get(key) != value:
                  raise SystemExit(f'V2.6 receipt mismatch for {key}.')
          if receipt.get('status') != 'UPGRADED_STAGED_NOT_EXECUTED':
              raise SystemExit('V2.6 receipt is not in the staged state.')
          if receipt.get('selfTest', {}).get('passed') is not True or receipt.get('liveExecution') is not False:
              raise SystemExit('V2.6 receipt does not record a passed offline self-test.')
          repair = receipt.get('repair', {})
          if repair.get('sourceSubmitClicks') != 0:
              raise SystemExit('The source V2.5 attempt did not record zero Submit clicks.')
          if repair.get('forcedEnableProhibited') is not True or repair.get('submittableTrueOverrideProhibited') is not True:
              raise SystemExit('V2.6 does not preserve the Marketo validation gate.')

          tests = {item.get('name'): item.get('ok') for item in receipt.get('selfTest', {}).get('tests', [])}
          required = {
              'semantic-acknowledgment-association',
              'submit-readiness-button-path',
              'submit-readiness-marketo-path',
              'submit-readiness-gate-preserved',
              'marketo-api-does-not-force-submittable',
              'disabled-submit-recovery',
              'direct-submit-block',
              'positive-candidate-network-evidence',
              'tamper-evident-event-chain',
          }
          failed = sorted(name for name in required if tests.get(name) is not True)
          if failed:
              raise SystemExit(f'Missing or failed V2.6 safety tests: {failed}')

          package = b''.join(path.read_bytes() for path in sorted(Path('tools/matadata-pathfinder/v22').glob('package.part.*')))
          package_sha = hashlib.sha256(package).hexdigest()
          evidence = {
              'status': 'PASSED',
              'runnerVersion': '2.6.0',
              'materializedPackageSha256': package_sha,
              'materializedPackageBytes': len(package),
              'runnerSha256': expected['runnerSha256'],
              'runnerGzipSha256': expected['runnerGzipSha256'],
              'applicationSha256': expected['applicationSha256'],
              'sourceSubmitClicks': 0,
              'forcedEnableProhibited': True,
              'submittableTrueOverrideProhibited': True,
              'selfTestCount': len(receipt.get('selfTest', {}).get('tests', [])),
              'liveFormOpened': False,
              'submitClicks': 0,
              'note': 'Package-level evidence contains a per-run self-test session identifier; immutable runner and application hashes are the execution identity.',
          }
          Path('pathfinder-preflight/V26_PREFLIGHT_RECEIPT.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload V2.6 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v26-preflight
          path: pathfinder-preflight
          if-no-files-found: warn
          retention-days: 30

  submit-once:
    name: Authorized human-gated V2.6 submission with Marketo recovery
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'submit' && inputs.authorization_phrase == format('JP-AUTHORIZED-ONE-SUBMIT:{0}', github.sha)) ||
        (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.title.from && startsWith(github.event.pull_request.title, '[EXECUTE MATADATA V2.6]') && contains(github.event.pull_request.body, format('JP-AUTHORIZED-ONE-SUBMIT:{0}', github.event.pull_request.head.sha)))
      )
    concurrency:
      group: matadata-openai-cybersecurity-grant-v1
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Refuse a second confirmed submission
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const name = process.env.LOCK_ARTIFACT_NAME;
            const response = await github.rest.actions.listArtifactsForRepo({owner, repo, name, per_page: 100});
            const active = response.data.artifacts.filter((artifact) => !artifact.expired);
            if (active.length > 0) core.setFailed(`Confirmed-submission lock ${name} already exists; no browser was started.`);

      - name: Check out the staged Pathfinder branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure patch utility is available
        shell: bash
        run: command -v patch || (sudo apt-get update -qq && sudo apt-get install -y patch)

      - name: Materialize and verify the immutable V2.6 runner for this live run
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/matadata-pathfinder/v26/upgrade.py > /tmp/matadata-v26-materialization.log
          mkdir -p /tmp/matadata-v26
          cat tools/matadata-pathfinder/v22/package.part.* > /tmp/matadata-v26/package.tar.gz
          gzip --test /tmp/matadata-v26/package.tar.gz
          tar -xzf /tmp/matadata-v26/package.tar.gz -C /tmp/matadata-v26
          echo "$RUNNER_GZIP_SHA256  /tmp/matadata-v26/runner.cjs.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/matadata-v26/runner.cjs.gz > /tmp/matadata-v26/runner.cjs
          echo "$RUNNER_SHA256  /tmp/matadata-v26/runner.cjs" | sha256sum --check
          node --check /tmp/matadata-v26/runner.cjs
          bash /tmp/matadata-v26/scripts/preflight.sh "$GITHUB_WORKSPACE/pathfinder-preflight-live"

      - name: Install isolated browser and tunnel runtime
        run: bash /tmp/matadata-v26/scripts/install-runtime.sh

      - name: Stage an isolated launcher root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/matadata-v26-launch
          mkdir -p /tmp/matadata-v26-launch/scripts
          cp /tmp/matadata-v26/runner.cjs.gz /tmp/matadata-v26-launch/runner.cjs.gz
          cp /tmp/matadata-v26/scripts/start-live.sh /tmp/matadata-v26-launch/scripts/start-live.sh
          test "$(realpath /tmp/matadata-v26-launch/runner.cjs.gz)" != "$(realpath /tmp/matadata-v26/runner.cjs.gz)"

      - name: Start V2.6 browser, watchdog, and independent public links
        run: bash /tmp/matadata-v26-launch/scripts/start-live.sh

      - name: Publish the private V2.6 live-session handoff
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v26-live-session
          path: pathfinder-session/session.json
          if-no-files-found: error
          retention-days: 1

      - name: Await JP's human-only steps and one confirmed submission
        run: bash /tmp/matadata-v26/scripts/wait-and-validate.sh

      - name: Preserve diagnostics
        if: always()
        run: bash /tmp/matadata-v26/scripts/collect-logs.sh

      - name: Upload receipt, readiness evidence, event chain, screenshots, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-openai-pathfinder-v26-receipt
          path: pathfinder-artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the cross-run confirmed-submission lock
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-openai-submission-lock-v1
          path: pathfinder-lock/submission-lock.json
          if-no-files-found: error
          retention-days: 90
