name: MATADATA OpenAI Form Pathfinder V2.2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      mode:
        description: Run offline preflight only, or start the explicitly authorized live session.
        required: true
        default: preflight
        type: choice
        options: [preflight, submit]
      authorization_phrase:
        description: For submit mode use JP-AUTHORIZED-ONE-SUBMIT:<exact commit SHA>.
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  PACKAGE_SHA256: f24a9cab7980e8d43a6be642e16500828952d89c1285af4cfff2ed363e078d11
  RUNNER_SHA256: d7fabf86cd9aa63644e9d09c5c0d2201b205503c2a0072502ee7cd1644faaf2b
  SUBMISSION_ID: matadata-openai-cybersecurity-grant-v1
  LOCK_ARTIFACT_NAME: matadata-openai-submission-lock-v1

jobs:
  preflight:
    name: Offline V2.2 safety and recovery preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and verify the reviewed package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matadata-v22 pathfinder-preflight
          cat tools/matadata-pathfinder/v22/package.part.* > /tmp/matadata-v22/package.tar.gz
          echo "$PACKAGE_SHA256  /tmp/matadata-v22/package.tar.gz" | sha256sum --check
          tar -xzf /tmp/matadata-v22/package.tar.gz -C /tmp/matadata-v22
          bash /tmp/matadata-v22/scripts/preflight.sh "$GITHUB_WORKSPACE/pathfinder-preflight"

      - name: Upload V2.2 preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v22-preflight
          path: pathfinder-preflight
          if-no-files-found: error
          retention-days: 30

  submit-once:
    name: Authorized human-gated submission with failover
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'submit' && inputs.authorization_phrase == format('JP-AUTHORIZED-ONE-SUBMIT:{0}', github.sha)) ||
        (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.title.from && startsWith(github.event.pull_request.title, '[EXECUTE MATADATA V2.2]') && contains(github.event.pull_request.body, format('JP-AUTHORIZED-ONE-SUBMIT:{0}', github.event.pull_request.head.sha)))
      )
    concurrency:
      group: matadata-openai-cybersecurity-grant-v1
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Refuse a second confirmed submission
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const name = process.env.LOCK_ARTIFACT_NAME;
            const response = await github.rest.actions.listArtifactsForRepo({owner, repo, name, per_page: 100});
            const active = response.data.artifacts.filter((artifact) => !artifact.expired);
            if (active.length > 0) core.setFailed(`Confirmed-submission lock ${name} already exists; no browser was started.`);

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and verify the exact reviewed package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matadata-v22
          cat tools/matadata-pathfinder/v22/package.part.* > /tmp/matadata-v22/package.tar.gz
          echo "$PACKAGE_SHA256  /tmp/matadata-v22/package.tar.gz" | sha256sum --check
          tar -xzf /tmp/matadata-v22/package.tar.gz -C /tmp/matadata-v22
          bash /tmp/matadata-v22/scripts/preflight.sh "$GITHUB_WORKSPACE/pathfinder-preflight-live"

      - name: Install isolated browser and tunnel runtime
        run: bash /tmp/matadata-v22/scripts/install-runtime.sh

      - name: Start browser, watchdog, and independent public links
        run: bash /tmp/matadata-v22/scripts/start-live.sh

      - name: Publish the private live-session handoff
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v22-live-session
          path: pathfinder-session/session.json
          if-no-files-found: error
          retention-days: 1

      - name: Await human-only steps and one confirmed submission
        run: bash /tmp/matadata-v22/scripts/wait-and-validate.sh

      - name: Preserve diagnostics
        if: always()
        run: bash /tmp/matadata-v22/scripts/collect-logs.sh

      - name: Upload receipt, event chain, screenshots, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-openai-pathfinder-v22-receipt
          path: pathfinder-artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Publish cross-run confirmed-submission lock
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-openai-submission-lock-v1
          path: pathfinder-lock/submission-lock.json
          if-no-files-found: error
          retention-days: 90
