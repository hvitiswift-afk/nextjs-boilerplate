name: Fardarter Receipt Idempotency v6.24

on:
  pull_request:
    paths:
      - ".github/workflows/fardarter-receipt-idempotency-v6-24.yml"
      - "docs/revenue/FARDARTER-DRIVE-RECEIPT-IDEMPOTENCY-V6-24.md"
      - "package.json"
      - "receipts/revenue/FARDARTER-DRIVE-RECEIPT-IDEMPOTENCY-V6-24.json"
      - "schemas/revenue/fardarter-drive-receipt-idempotency-v6-24.schema.json"
      - "scripts/check-fardarter-receipt-idempotency-v6-24.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fardarter-receipt-idempotency-v6-24.yml"
      - "docs/revenue/FARDARTER-DRIVE-RECEIPT-IDEMPOTENCY-V6-24.md"
      - "package.json"
      - "receipts/revenue/FARDARTER-DRIVE-RECEIPT-IDEMPOTENCY-V6-24.json"
      - "schemas/revenue/fardarter-drive-receipt-idempotency-v6-24.schema.json"
      - "scripts/check-fardarter-receipt-idempotency-v6-24.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fardarter-receipt-idempotency-v6-24-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify cross-layer receipt idempotency v6.24
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify v6.24 receipt idempotency contract
        run: npm run fardarter:receipt-idempotency:check
      - name: Verify exact v6.24 JSON syntax
        run: |
          node -e 'for (const path of [
            "receipts/revenue/FARDARTER-DRIVE-RECEIPT-IDEMPOTENCY-V6-24.json",
            "schemas/revenue/fardarter-drive-receipt-idempotency-v6-24.schema.json"
          ]) JSON.parse(require("node:fs").readFileSync(path, "utf8")); console.log("Fardarter Drive v6.24 exact JSON syntax: PASS")'
      - name: Emit read-only receipt
        run: |
          echo "result=PASS"
          echo "control=FARDARTER-DRIVE-RECEIPT-IDEMPOTENCY-V6-24"
          echo "controller_version=6.24.0"
          echo "manifest_digest=bc40c24523b4a2b8bffcc5403b7b6ed18be8251b5653abecaaaf266c74e8e69b"
          echo "post_merge_state=CROSS_LAYER_RECEIPT_IDEMPOTENCY_RECONCILED"
          echo "duplicate_classification=CROSSED_MESSAGE_DUPLICATE_RECEIPT"
          echo "revision_conflict_action=RESTART_FROM_FIRST_SEARCH"
          echo "active_control_head=FARDARTER-DRIVE-CURRENT-CONTROL-HEAD-V6-21"
          echo "public_issue_mutation=false"
          echo "private_drive_mutation=false"
          echo "canonical_mutation=false"
          echo "provider_mutation=false"
          echo "consequential_effects=ZERO"
