name: MATADATA Pathfinder V2.4 Upgrade

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: matadata-v24-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    if: github.head_ref == 'agent/matadata-openai-pathfinder-v2-2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the staged Pathfinder branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Apply and verify the V2.4 textarea normalization repair
        shell: bash
        run: |
          set -o pipefail
          python -u tools/matadata-pathfinder/v24/upgrade.py 2>&1 | tee /tmp/matadata-v24-upgrade.log

      - name: Package the verified generated V2.4 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matadata-v24-generated/.github/workflows
          mkdir -p /tmp/matadata-v24-generated/tools/matadata-pathfinder/v22
          cp .github/workflows/matadata-openai-pathfinder-v22.yml /tmp/matadata-v24-generated/.github/workflows/
          cp tools/matadata-pathfinder/v22/package.part.* /tmp/matadata-v24-generated/tools/matadata-pathfinder/v22/
          cp tools/matadata-pathfinder/v22/V24_UPGRADE_RECEIPT.json /tmp/matadata-v24-generated/tools/matadata-pathfinder/v22/
          tar -C /tmp/matadata-v24-generated -czf /tmp/matadata-v24-generated.tar.gz .
          sha256sum /tmp/matadata-v24-generated.tar.gz > /tmp/matadata-v24-generated.tar.gz.sha256

      - name: Preserve upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v24-upgrade-diagnostics
          path: /tmp/matadata-v24-upgrade.log
          if-no-files-found: warn
          retention-days: 1

      - name: Upload verified generated V2.4 files
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v24-generated
          path: |
            /tmp/matadata-v24-generated.tar.gz
            /tmp/matadata-v24-generated.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
