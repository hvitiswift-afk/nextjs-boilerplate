name: Netlify Audit Product Deploy

on:
  pull_request:
    paths:
      - ".github/workflows/audit-request-intake.yml"
      - ".github/workflows/netlify-audit-product-deploy.yml"
      - "app/github-control-tower-audit/**"
      - "app/api/revenue/pilot/**"
      - "app/page.tsx"
      - "app/robots.ts"
      - "app/sitemap.ts"
      - "docs/repository/REVENUE-AUTHORITY-CAPACITY-V3.md"
      - "docs/repository/FARDARTER-DRIVE.md"
      - "docs/repository/INDEMNITY-LIABILITY-READINESS.md"
      - "examples/revenue-experiment.sample.json"
      - "receipts/revenue/**"
      - "schemas/revenue/**"
      - "scripts/check-revenue-*.mjs"
      - "scripts/check-fardarter-drive.mjs"
      - "src/lib/revenue/**"
      - "src/lib/site-url.ts"
      - "templates/fardarter-drive-*.md"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-request-intake.yml"
      - ".github/workflows/netlify-audit-product-deploy.yml"
      - "app/github-control-tower-audit/**"
      - "app/api/revenue/pilot/**"
      - "app/page.tsx"
      - "app/robots.ts"
      - "app/sitemap.ts"
      - "docs/repository/REVENUE-AUTHORITY-CAPACITY-V3.md"
      - "docs/repository/FARDARTER-DRIVE.md"
      - "docs/repository/INDEMNITY-LIABILITY-READINESS.md"
      - "examples/revenue-experiment.sample.json"
      - "receipts/revenue/**"
      - "schemas/revenue/**"
      - "scripts/check-revenue-*.mjs"
      - "scripts/check-fardarter-drive.mjs"
      - "src/lib/revenue/**"
      - "src/lib/site-url.ts"
      - "templates/fardarter-drive-*.md"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-audit-product-${{ github.ref }}
  cancel-in-progress: false

env:
  NETLIFY_SITE_ID: 21d3bb41-3a69-4a7d-b6c6-e873cde8ee2f
  NETLIFY_PRIMARY_URL: https://lichburn-v0-2-8.netlify.app

jobs:
  validate:
    name: Validate Fardarter Drive audit deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Fardarter Drive revenue and authority package
        run: npm run revenue:verify

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy and read back Fardarter Drive product
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require existing-site credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN" || {
            echo "Missing GitHub Actions secret NETLIFY_AUTH_TOKEN"
            exit 1
          }
          test "$NETLIFY_SITE_ID" = "21d3bb41-3a69-4a7d-b6c6-e873cde8ee2f" || {
            echo "Unexpected Netlify site ID"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Revalidate Fardarter Drive package
        run: npm run revenue:verify

      - name: Deploy to confirmed Netlify site
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(npx -y netlify-cli@latest deploy --build --prod --json --site "$NETLIFY_SITE_ID")"
          printf '%s\n' "$RESULT" > netlify-deploy-result.json
          DEPLOY_URL="$(node -e 'const x=JSON.parse(require("fs").readFileSync("netlify-deploy-result.json","utf8")); console.log(x.deploy_url || x.deploy_ssl_url || x.ssl_url || x.url || "")')"
          DEPLOY_ID="$(node -e 'const x=JSON.parse(require("fs").readFileSync("netlify-deploy-result.json","utf8")); console.log(x.deploy_id || x.id || "")')"
          test -n "$DEPLOY_URL" || { echo "Netlify did not return a deploy URL"; exit 1; }
          test -n "$DEPLOY_ID" || { echo "Netlify did not return a deploy ID"; exit 1; }
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Verify immutable deploy readback
        id: readback
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          retry_get() {
            local url="$1"
            local output="$2"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --max-time 30 "$url" --output "$output"
          }

          retry_get "$DEPLOY_URL/" artifacts/home.html
          retry_get "$DEPLOY_URL/github-control-tower-audit" artifacts/audit.html
          retry_get "$DEPLOY_URL/api/revenue/pilot" artifacts/pilot.json
          retry_get "$DEPLOY_URL/sitemap.xml" artifacts/sitemap.xml
          retry_get "$DEPLOY_URL/robots.txt" artifacts/robots.txt

          grep -q '/github-control-tower-audit' artifacts/home.html
          grep -q 'GitHub Control Tower Audit' artifacts/audit.html
          grep -q 'Fardarter Drive' artifacts/audit.html
          grep -q 'Request a public-safe fit check' artifacts/audit.html
          grep -q 'Aspirational horizons' artifacts/audit.html
          grep -q 'not achieved' artifacts/audit.html
          grep -q 'not indemnity-proof' artifacts/audit.html
          grep -q 'Current gross' artifacts/audit.html
          grep -q 'Settled cash' artifacts/audit.html
          grep -q '/github-control-tower-audit' artifacts/sitemap.xml
          grep -q '/sitemap.xml' artifacts/robots.txt

          node <<'NODE'
          const fs = require('node:fs');
          const pilot = JSON.parse(fs.readFileSync('artifacts/pilot.json', 'utf8'));
          const publicRequestCount = pilot.publicInterest?.openFitCheckRequests;
          const validPublicRequestCount =
            publicRequestCount === null ||
            (Number.isInteger(publicRequestCount) && publicRequestCount >= 0);
          const horizonMap = new Map(
            (pilot.fardarterDrive?.horizons || []).map((stage) => [stage.stageId, stage]),
          );
          const expectedHorizons = [
            ['FD-001K', '1000', 'CURRENT_EXPERIMENT_TARGET'],
            ['FD-001M', '1000000', 'ASPIRATIONAL_HORIZON'],
            ['FD-001B', '1000000000', 'ASPIRATIONAL_HORIZON'],
            ['FD-001T', '1000000000000', 'ASPIRATIONAL_HORIZON'],
            ['FD-001Q', '1000000000000000', 'SYMBOLIC_POSSIBILITY_HORIZON'],
          ];
          const horizonChecks = expectedHorizons.flatMap(([stageId, amountUsd, classification]) => {
            const stage = horizonMap.get(stageId);
            return [
              [stage?.amountUsd === amountUsd, `${stageId}.amountUsd`],
              [stage?.classification === classification, `${stageId}.classification`],
              [stage?.achieved === false, `${stageId}.achieved`],
              [stage?.forecast === false, `${stageId}.forecast`],
              [stage?.guaranteed === false, `${stageId}.guaranteed`],
            ];
          });
          const required = [
            [pilot.schemaVersion === '1.3.0', 'schemaVersion'],
            [pilot.experimentId === 'JP-REV-001', 'experimentId'],
            [pilot.status === 'PUBLISHED', 'status'],
            [pilot.offer?.priceUsd === 100, 'priceUsd'],
            [pilot.offer?.firstMilestoneUsd === 500, 'firstMilestoneUsd'],
            [pilot.offer?.grossTargetUsd === 1000, 'grossTargetUsd'],
            [pilot.offer?.capacity === 10, 'capacity'],
            [pilot.offer?.maxConcurrentDeliveries === 2, 'maxConcurrentDeliveries'],
            [pilot.availability?.orders === 0, 'orders'],
            [pilot.availability?.slotsRemaining === 10, 'slotsRemaining'],
            [pilot.availability?.activeDeliveryLimit === 2, 'activeDeliveryLimit'],
            [validPublicRequestCount, 'openFitCheckRequests'],
            [pilot.publicInterest?.countedAsOrders === false, 'interestNotOrders'],
            [pilot.publicInterest?.reservesCapacity === false, 'interestNotReservations'],
            [['AVAILABLE', 'UNAVAILABLE'].includes(pilot.publicInterest?.sourceState), 'interestSourceState'],
            [pilot.money?.grossRevenueUsd === 0, 'grossRevenueUsd'],
            [pilot.money?.netCashUsd === 0, 'netCashUsd'],
            [pilot.publication?.issueNumber === 133, 'issueNumber'],
            [pilot.fardarterDrive?.driveId === 'FARDARTER-DRIVE-V4', 'driveId'],
            [pilot.fardarterDrive?.controllingIssues?.join(',') === '141,142,143', 'controllingIssues'],
            [pilot.fardarterDrive?.currentEvidence?.verifiedGrossRevenueUsd === 0, 'driveCurrentGross'],
            [pilot.fardarterDrive?.currentEvidence?.verifiedSettledCashUsd === 0, 'driveCurrentSettled'],
            [pilot.fardarterDrive?.currentEvidence?.deploymentState === 'UNVERIFIED', 'sourceDeploymentState'],
            [pilot.fardarterDrive?.progressionRules?.automaticStagePromotion === false, 'noAutomaticStagePromotion'],
            [pilot.fardarterDrive?.progressionRules?.manualAuditCapacityMayBeMultipliedToClaimHigherStage === false, 'noPilotMultiplicationClaim'],
            [pilot.fardarterDrive?.legalRisk?.indemnityProofClaimed === false, 'noIndemnityProofClaim'],
            [pilot.fardarterDrive?.legalRisk?.counselReviewRequiredForIndemnityAndLiabilityTerms === true, 'counselReviewGate'],
            [pilot.authority?.version === '4.0.0', 'authorityVersion'],
            [pilot.authority?.revoked === false, 'authorityActive'],
            [pilot.authority?.scaleHorizonPublication === 'AUTHORIZED_ACTIVE', 'scalePublication'],
            [pilot.authority?.documentDraftAutomation === 'AUTHORIZED_ACTIVE', 'documentDraftAutomation'],
            [pilot.authority?.relevantExactOutreach === 'AUTHORIZED_CONDITIONAL', 'exactOutreach'],
            [pilot.authority?.automatedIntake?.state === 'AUTHORIZED_ACTIVE', 'automatedIntakeState'],
            [pilot.authority?.automatedIntake?.exactTitlePrefix === '[Audit request]:', 'exactTitlePrefix'],
            [pilot.authority?.automatedIntake?.mayCreateOrder === false, 'automationNotOrder'],
            [pilot.authority?.automatedIntake?.mayReserveCapacity === false, 'automationNotReservation'],
            [pilot.authority?.automatedIntake?.mayAcceptContract === false, 'automationNotContract'],
            [pilot.authority?.automatedIntake?.mayRequestPayment === false, 'automationNotPayment'],
            [pilot.authority?.automatedIntake?.mayStartDelivery === false, 'automationNotDelivery'],
            [pilot.authority?.contractAcceptance === 'HUMAN_APPROVAL_REQUIRED', 'contractGate'],
            [pilot.authority?.indemnityAndLiabilityTerms === 'COUNSEL_REVIEW_REQUIRED', 'indemnityGate'],
            [pilot.authority?.paymentExecution === 'EXTERNAL_PROVIDER_ONLY', 'paymentGate'],
            [pilot.authority?.deliveryStart === 'HUMAN_APPROVAL_REQUIRED', 'deliveryGate'],
            [pilot.chainReceipt?.result === 'CHAIN_RESOLVED', 'chainResult'],
            [pilot.chainReceipt?.firstObject === 133, 'chainFirst'],
            [pilot.chainReceipt?.lastObject === 140, 'chainLast'],
            [pilot.chainReceipt?.objectCount === 8, 'chainCount'],
            [pilot.evidenceBoundary?.receivedCashRequires === 'PAID_SETTLED', 'receivedCashRequires'],
            [pilot.evidenceBoundary?.openingAnIssueCreatesContract === false, 'contractBoundary'],
            [pilot.evidenceBoundary?.documentDraftCreatesContract === false, 'draftContractBoundary'],
            [pilot.evidenceBoundary?.invoiceDraftCreatesPaymentObligation === false, 'invoiceBoundary'],
            [pilot.evidenceBoundary?.horizonAmountIsAchievedRevenue === false, 'horizonRevenueBoundary'],
            [pilot.evidenceBoundary?.horizonAmountIsValuation === false, 'horizonValuationBoundary'],
            [pilot.evidenceBoundary?.automaticStagePromotion === false, 'stagePromotionBoundary'],
            [pilot.evidenceBoundary?.templateIsIndemnityProof === false, 'templateIndemnityBoundary'],
            [pilot.evidenceBoundary?.indemnityAndLiabilityTermsRequireCounselReview === true, 'legalReviewBoundary'],
            [pilot.evidenceBoundary?.buyerConsentRequiredForBindingAgreement === true, 'buyerConsentBoundary'],
            [pilot.evidenceBoundary?.earningsGuaranteed === false, 'earningsBoundary'],
            ...horizonChecks,
          ];
          const failed = required.filter(([ok]) => !ok).map(([, label]) => label);
          if (failed.length) throw new Error(`Readback failed: ${failed.join(', ')}`);
          console.log('Netlify Fardarter Drive product readback: PASS');
          NODE

          echo "readback=PASS" >> "$GITHUB_OUTPUT"

      - name: Write deployment receipt
        if: always()
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          READBACK: ${{ steps.readback.outputs.readback }}
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs = require('node:fs');
          const deployed = Boolean(process.env.DEPLOY_ID);
          const readback = process.env.READBACK || 'NOT_COMPLETED';
          const receipt = {
            schemaVersion: '1.3.0',
            receiptId: `FARDARTER-DRIVE-V4-NETLIFY-${process.env.GITHUB_RUN_ID}`,
            driveId: 'FARDARTER-DRIVE-V4',
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            siteId: process.env.NETLIFY_SITE_ID,
            primaryUrl: process.env.NETLIFY_PRIMARY_URL,
            deployId: process.env.DEPLOY_ID || null,
            deployUrl: process.env.DEPLOY_URL || null,
            productionRequested: true,
            deploymentCompleted: deployed,
            readback,
            result: deployed && readback === 'PASS' ? 'DEPLOYED_AND_VERIFIED' : 'INCOMPLETE',
            verifiedRoutes: ['/', '/github-control-tower-audit', '/api/revenue/pilot', '/sitemap.xml', '/robots.txt'],
            authorityVersion: '4.0.0',
            chainReceipt: 'JP-REV-001-CHAIN-133-140',
            currentEvidence: {
              priceUsd: 100,
              totalSlots: 10,
              maximumActiveDeliveries: 2,
              orders: 0,
              verifiedRevenueUsd: 0,
              verifiedSettledCashUsd: 0
            },
            horizons: {
              FD_001K: 'UNACHIEVED_NONFORECAST',
              FD_001M: 'UNACHIEVED_NONFORECAST',
              FD_001B: 'UNACHIEVED_NONFORECAST',
              FD_001T: 'UNACHIEVED_NONFORECAST',
              FD_001Q: 'SYMBOLIC_UNACHIEVED'
            },
            legalBoundary: {
              documentDraftsMayBePrepared: true,
              finalContractRequiresHumanAcceptance: true,
              indemnityAndLiabilityTermsRequireCounselReview: true,
              templateIsIndemnityProof: false,
              paymentExecution: 'EXTERNAL_PROVIDER_ONLY'
            },
            externalActionsPerformed: deployed ? ['NETLIFY_PRODUCTION_DEPLOY'] : [],
            excludedAutomaticActions: [
              'new_site_creation',
              'domain_change',
              'billing_change',
              'credential_change',
              'payment_execution',
              'contract_acceptance',
              'delivery_start',
              'refund_or_dispute_response',
              'claim_horizon_as_achieved',
              'claim_indemnity_proof'
            ],
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync('artifacts/fardarter-drive-v4-netlify-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
          if [ -f netlify-deploy-result.json ]; then cp netlify-deploy-result.json artifacts/; fi

      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fardarter-drive-v4-${{ github.sha }}
          path: artifacts
          retention-days: 30

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Fardarter Drive v4 deployment"
            echo "- Site ID: $NETLIFY_SITE_ID"
            echo "- Primary URL: $NETLIFY_PRIMARY_URL"
            echo "- Deploy ID: ${{ steps.deploy.outputs.deploy_id }}"
            echo "- Deploy URL: ${{ steps.deploy.outputs.deploy_url }}"
            echo "- Readback: ${{ steps.readback.outputs.readback }}"
            echo "- Authority version: 4.0.0"
            echo "- Chain receipt: #133-#140"
            echo "- Current verified revenue: $0 USD"
            echo "- Current verified settled cash: $0 USD"
            echo "- Higher horizons: unachieved / nonforecast"
            echo "- Indemnity status: counsel-gated / not indemnity-proof"
          } >> "$GITHUB_STEP_SUMMARY"
