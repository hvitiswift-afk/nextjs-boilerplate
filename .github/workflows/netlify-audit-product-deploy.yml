name: Netlify Audit Product Deploy

on:
  pull_request:
    paths:
      - ".github/workflows/fardarter-*.yml"
      - ".github/workflows/netlify-audit-product-deploy.yml"
      - "app/github-control-tower-audit/**"
      - "app/api/revenue/**"
      - "app/page.tsx"
      - "app/robots.ts"
      - "app/sitemap.ts"
      - "docs/repository/**FARDARTER*"
      - "examples/revenue-experiment.sample.json"
      - "receipts/revenue/**"
      - "schemas/revenue/**"
      - "scripts/check-revenue-*.mjs"
      - "scripts/check-fardarter-*.mjs"
      - "src/lib/revenue/**"
      - "src/lib/site-url.ts"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fardarter-*.yml"
      - ".github/workflows/netlify-audit-product-deploy.yml"
      - "app/github-control-tower-audit/**"
      - "app/api/revenue/**"
      - "app/page.tsx"
      - "app/robots.ts"
      - "app/sitemap.ts"
      - "docs/repository/**FARDARTER*"
      - "examples/revenue-experiment.sample.json"
      - "receipts/revenue/**"
      - "schemas/revenue/**"
      - "scripts/check-revenue-*.mjs"
      - "scripts/check-fardarter-*.mjs"
      - "src/lib/revenue/**"
      - "src/lib/site-url.ts"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-fardarter-v6-${{ github.ref }}
  cancel-in-progress: false

env:
  NETLIFY_SITE_ID: 21d3bb41-3a69-4a7d-b6c6-e873cde8ee2f
  NETLIFY_PRIMARY_URL: https://lichburn-v0-2-8.netlify.app

jobs:
  validate:
    name: Validate Fardarter Drive v6.5 deploy
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify FARDARTER-DRIVE-V6, CAPACITY_OVERRIDE_ACTIVE boundary, and v6.5 application
        run: npm run revenue:verify
      - run: npm run build

  deploy:
    name: Deploy and read back Fardarter Drive v6.5
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Require confirmed existing site
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "Missing NETLIFY_AUTH_TOKEN"; exit 1; }
          test "$NETLIFY_SITE_ID" = "21d3bb41-3a69-4a7d-b6c6-e873cde8ee2f" || { echo "Unexpected site ID"; exit 1; }
      - run: npm ci
      - run: npm run revenue:verify
      - name: Deploy to confirmed Netlify site
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(npx -y netlify-cli@latest deploy --build --prod --json --site "$NETLIFY_SITE_ID")"
          printf '%s\n' "$RESULT" > netlify-deploy-result.json
          DEPLOY_URL="$(node -e 'const x=JSON.parse(require("fs").readFileSync("netlify-deploy-result.json","utf8")); console.log(x.deploy_url || x.deploy_ssl_url || x.ssl_url || x.url || "")')"
          DEPLOY_ID="$(node -e 'const x=JSON.parse(require("fs").readFileSync("netlify-deploy-result.json","utf8")); console.log(x.deploy_id || x.id || "")')"
          test -n "$DEPLOY_URL" || { echo "Missing deploy URL"; exit 1; }
          test -n "$DEPLOY_ID" || { echo "Missing deploy ID"; exit 1; }
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
      - name: Verify immutable v6.5 routes
        id: readback
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          get() { curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 "$1" --output "$2"; }
          get "$DEPLOY_URL/" artifacts/home.html
          get "$DEPLOY_URL/github-control-tower-audit" artifacts/audit.html
          get "$DEPLOY_URL/github-control-tower-audit/canonicalization-application" artifacts/application.html
          get "$DEPLOY_URL/api/revenue/pilot" artifacts/pilot.json
          get "$DEPLOY_URL/api/revenue/operations" artifacts/operations.json
          get "$DEPLOY_URL/api/revenue/reconciliation" artifacts/reconciliation.json
          get "$DEPLOY_URL/api/revenue/canonicalization-preview" artifacts/preview.json
          get "$DEPLOY_URL/api/revenue/canonicalization-application" artifacts/application.json
          get "$DEPLOY_URL/sitemap.xml" artifacts/sitemap.xml
          get "$DEPLOY_URL/robots.txt" artifacts/robots.txt

          grep -q 'Fardarter Drive' artifacts/audit.html
          grep -q '1,000 total slots' artifacts/audit.html
          grep -q '100 standard ACTIVE' artifacts/audit.html
          grep -q 'Above 100 is allowed' artifacts/audit.html
          grep -q 'CAPACITY_OVERRIDE_ACTIVE' artifacts/audit.html
          grep -q 'INACTIVE_NO_RECEIPT' artifacts/audit.html
          grep -q 'not indemnity-proof' artifacts/audit.html
          grep -q 'Reviewed canonicalization application' artifacts/application.html
          grep -q '/github-control-tower-audit/canonicalization-application' artifacts/sitemap.xml
          grep -q '/sitemap.xml' artifacts/robots.txt

          node <<'NODE'
          const fs = require('node:fs');
          const pilot = JSON.parse(fs.readFileSync('artifacts/pilot.json','utf8'));
          const ops = JSON.parse(fs.readFileSync('artifacts/operations.json','utf8'));
          const rec = JSON.parse(fs.readFileSync('artifacts/reconciliation.json','utf8'));
          const preview = JSON.parse(fs.readFileSync('artifacts/preview.json','utf8'));
          const app = JSON.parse(fs.readFileSync('artifacts/application.json','utf8'));
          const EVENT = '3859eac9c63bef83624111704d38cf217b0c1a4ece6df874e72a76e9fb1ffc3b';
          const SNAPSHOT = '7c7f47f40868f4879942406274b01710af74539d5b840f0edb18d24400ddbdf3';
          const APPLICATION = '6692334b17fae5e26d973b92d6476a52d4f316489e085eba76971173f03f156f';
          const required = [
            [pilot.fardarterDrive?.driveId === 'FARDARTER-DRIVE-V6', 'pilot.drive'],
            [pilot.offer?.capacity === 1000 && pilot.offer?.maxConcurrentDeliveries === 100, 'pilot.capacity'],
            [pilot.capacityOverride?.activationTarget === 'CAPACITY_OVERRIDE_ACTIVE', 'pilot.override'],
            [pilot.capacityOverride?.state === 'INACTIVE_NO_RECEIPT', 'pilot.overrideState'],
            [pilot.money?.grossRevenueUsd === 0 && pilot.money?.netCashUsd === 0, 'pilot.money'],
            [ops.receiptChain?.headSequence === 1 && ops.receiptChain?.canonicalBusinessEventCount === 1, 'ops.head'],
            [ops.receiptChain?.headDigest === EVENT && ops.canonicalCounts?.SCOPE_DRAFTED === 1, 'ops.event'],
            [ops.capacity?.activeDeliveries === 0 && ops.capacity?.activeHeadroom === 100, 'ops.capacity'],
            [ops.commercialEvidence?.orders === 0 && ops.commercialEvidence?.verifiedSettledCashUsd === 0, 'ops.money'],
            [rec.snapshot?.sequence === 1 && rec.snapshot?.digest === SNAPSHOT, 'rec.snapshot'],
            [rec.canonicalHead?.headSequence === undefined || rec.canonicalHead?.sequence === 1, 'rec.head'],
            [rec.currentApplication?.digest === APPLICATION, 'rec.application'],
            [preview.reviewedApplication?.digest === APPLICATION && preview.canonicalCurrentState?.headSequence === 1, 'preview.application'],
            [app.applicationDigest === APPLICATION, 'app.digest'],
            [app.canonicalEvent?.eventDigest === EVENT && app.canonicalEvent?.sequence === 1, 'app.event'],
            [app.reconciliation?.snapshotDigest === SNAPSHOT, 'app.snapshot'],
            [app.currentCanonicalState?.stateCounts?.SCOPE_DRAFTED === 1, 'app.scope'],
            [app.currentCanonicalState?.activeDeliveries === 0 && app.currentCanonicalState?.orders === 0, 'app.zeroEffects'],
            [app.currentCanonicalState?.verifiedSettledCashUsd === 0 && app.currentCanonicalState?.receivedCashRequires === 'PAID_SETTLED', 'app.cash'],
          ];
          const failed = required.filter(([ok]) => !ok).map(([,label]) => label);
          if (failed.length) throw new Error(`v6.5 immutable readback failed: ${failed.join(', ')}`);
          console.log('Fardarter Drive v6.5 immutable readback: PASS');
          NODE
          echo "readback=PASS" >> "$GITHUB_OUTPUT"
      - name: Write deployment receipt
        if: always()
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          READBACK: ${{ steps.readback.outputs.readback }}
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs = require('node:fs');
          const deployed = Boolean(process.env.DEPLOY_ID);
          const readback = process.env.READBACK || 'NOT_COMPLETED';
          fs.writeFileSync('artifacts/netlify-fardarter-v6-5-receipt.json', JSON.stringify({
            schemaVersion: '1.0.0',
            receiptId: `FARDARTER-DRIVE-V6-5-NETLIFY-${process.env.GITHUB_RUN_ID}`,
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            siteId: process.env.NETLIFY_SITE_ID,
            primaryUrl: process.env.NETLIFY_PRIMARY_URL,
            deployId: process.env.DEPLOY_ID || null,
            deployUrl: process.env.DEPLOY_URL || null,
            result: deployed && readback === 'PASS' ? 'DEPLOYED_AND_VERIFIED' : 'INCOMPLETE',
            driveId: 'FARDARTER-DRIVE-V6',
            canonicalHeadSequence: 1,
            canonicalBusinessEventCount: 1,
            canonicalEventDigest: '3859eac9c63bef83624111704d38cf217b0c1a4ece6df874e72a76e9fb1ffc3b',
            reconciliationDigest: '7c7f47f40868f4879942406274b01710af74539d5b840f0edb18d24400ddbdf3',
            applicationDigest: '6692334b17fae5e26d973b92d6476a52d4f316489e085eba76971173f03f156f',
            scopeDrafted: 1,
            activeDeliveries: 0,
            orders: 0,
            verifiedRevenueUsd: 0,
            verifiedSettledCashUsd: 0,
            generatedAt: new Date().toISOString(),
          }, null, 2) + '\n');
          NODE
          if [ -f netlify-deploy-result.json ]; then cp netlify-deploy-result.json artifacts/; fi
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-fardarter-v6-${{ github.sha }}
          path: artifacts
          retention-days: 30
