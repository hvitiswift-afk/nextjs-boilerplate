name: Fardarter GitHub Primary Platform Authority v6.28

on:
  pull_request:
    paths:
      - "receipts/repository/FARDARTER-DRIVE-GITHUB-PRIMARY-PLATFORM-AUTHORITY-V6-28.json"
      - "schemas/repository/fardarter-drive-github-primary-platform-authority-v6-28.schema.json"
      - "scripts/check-fardarter-github-primary-platform-authority-v6-28.mjs"
      - "docs/repository/FARDARTER-DRIVE-GITHUB-PRIMARY-PLATFORM-AUTHORITY-V6-28.md"
      - ".github/workflows/fardarter-github-primary-platform-authority-v6-28.yml"
      - "README.md"
      - "docs/DEPLOY.md"
      - "docs/VERCEL-BILLING-BLOCKER.md"
      - "docs/repository/NETLIFY-AUDIT-PRODUCT-DEPLOYMENT.md"
      - "package.json"
  workflow_dispatch:
  schedule:
    - cron: "28 9 * * 1"

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  verify:
    name: Verify GitHub-primary authority v6.28
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Capture bounded issue state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > /tmp/fardarter-v6-28-issues.ndjson
          : > /tmp/fardarter-v6-28-comments.ndjson
          for issue in 14 16 17 20 22 25 102; do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" >> /tmp/fardarter-v6-28-issues.ndjson
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments?per_page=100" --slurp >> /tmp/fardarter-v6-28-comments.ndjson
          done
          jq -s '.' /tmp/fardarter-v6-28-issues.ndjson > /tmp/fardarter-v6-28-issues.json
          jq -s 'map(if type == "array" then . else [.] end) | flatten' /tmp/fardarter-v6-28-comments.ndjson > /tmp/fardarter-v6-28-comments.json

      - name: Capture GitHub Pages state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /tmp/fardarter-v6-28-pages.json 2>/tmp/fardarter-v6-28-pages-error.txt; then
            true
          else
            jq -n --arg error "PAGES_NOT_ENABLED_OR_NOT_VISIBLE" --rawfile detail /tmp/fardarter-v6-28-pages-error.txt '{error:$error,detail:$detail}' > /tmp/fardarter-v6-28-pages.json
          fi

      - name: Verify GitHub-primary authority
        run: >-
          npm run fardarter:github-primary:check --
          --issues /tmp/fardarter-v6-28-issues.json
          --comments /tmp/fardarter-v6-28-comments.json
          --pages /tmp/fardarter-v6-28-pages.json
          | tee /tmp/fardarter-v6-28-receipt.json

      - name: Verify exact JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('receipts/repository/FARDARTER-DRIVE-GITHUB-PRIMARY-PLATFORM-AUTHORITY-V6-28.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('schemas/repository/fardarter-drive-github-primary-platform-authority-v6-28.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('/tmp/fardarter-v6-28-issues.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('/tmp/fardarter-v6-28-pages.json','utf8'))"

      - name: Assemble read-only authority artifact
        run: |
          mkdir -p /tmp/fardarter-v6-28-artifact
          cp /tmp/fardarter-v6-28-receipt.json /tmp/fardarter-v6-28-artifact/
          cp /tmp/fardarter-v6-28-issues.json /tmp/fardarter-v6-28-artifact/
          cp /tmp/fardarter-v6-28-comments.json /tmp/fardarter-v6-28-artifact/
          cp /tmp/fardarter-v6-28-pages.json /tmp/fardarter-v6-28-artifact/
          cp receipts/repository/FARDARTER-DRIVE-GITHUB-PRIMARY-PLATFORM-AUTHORITY-V6-28.json /tmp/fardarter-v6-28-artifact/

      - name: Upload authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: fardarter-github-primary-v6-28-${{ github.run_id }}
          path: /tmp/fardarter-v6-28-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Emit nonconsequential governance receipt
        run: |
          echo "control=FARDARTER-DRIVE-GITHUB-PRIMARY-PLATFORM-AUTHORITY-V6-28"
          echo "manifest_digest=08f24213e0cb980f726a30d5fc58574430dfe4a3ad19715d7469d2ef97ed16aa"
          echo "primary_platform=GITHUB"
          echo "pages_state=PENDING_EXACT_ENABLEMENT_WORKFLOW_AND_PUBLIC_READBACK"
          echo "provider_mutation=false"
          echo "consequential_effects=ZERO_PROVIDER_EFFECTS"
