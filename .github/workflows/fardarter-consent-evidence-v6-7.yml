name: Fardarter Consent Evidence v6.7

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fardarter-consent-evidence-v6-7-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[FD consent evidence]:') &&
       contains(github.event.issue.labels.*.name, 'fd-consent-evidence-approved-v6-7'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const chain = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-STATE-EVENTS-V6-2.json','utf8'));
            const reconciliation = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-RECONCILIATION-V6-5.json','utf8'));
            const manifest = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-CONSENT-EVIDENCE-V6-7.json','utf8'));
            const issue = context.payload.issue;
            if (!issue) return;
            const body = issue.body || '';
            const section = (label) => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = body.match(new RegExp(`### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`));
              return match?.[1]?.trim() || '';
            };

            const sourceIssue = Number((section('Source entity issue').match(/#?(\d+)/) || [])[1]);
            const packageState = section('Claimed private package state').split(/\s+/)[0];
            const attestationDigest = section('Public-safe attestation digest').split(/\s+/)[0];
            const reviewerRole = section('Independent reviewer role classification').split(/\s+/)[0];
            const verificationState = section('Claimed independent verification state').split(/\s+/)[0];
            const revocationState = section('Revocation and contradiction state').split(/\s+/)[0];
            const reviewBy = section('Review-by or expiry time').split(/\s+/)[0];
            const key = section('Public-safe consent review idempotency key').split(/\s+/)[0];
            const summary = section('Public-safe evidence-state summary');

            const marker = `jp-fardarter-consent-v6-7-${sourceIssue}-${packageState}-${key}`
              .replace(/[^A-Za-z0-9:_-]+/g,'-').slice(0,220);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, per_page: 100,
            });
            if (comments.some((comment) => comment.body?.includes(marker))) return;

            const entityEvents = chain.events.filter((event) =>
              event.entityType === 'GITHUB_ISSUE' && Number(event.entityId) === sourceIssue
            );
            const currentState = entityEvents.at(-1)?.toState || null;
            const expired = !reviewBy || Number.isNaN(Date.parse(reviewBy)) || Date.parse(reviewBy) <= Date.now();
            const keyValid = /^[A-Za-z0-9:_-]{8,160}$/.test(key);
            const digestValid = attestationDigest === 'NONE' || /^[a-f0-9]{64}$/.test(attestationDigest);
            const secretAssignment = /(?:password|secret|access[_ -]?token|api[_ -]?key|private[_ -]?key|routing(?: number)?|bank account|account number|provider transaction(?: id)?|signature(?: value)?|buyer(?: name| email| phone)?|customer(?: name| email| phone)?)\s*[:=]\s*\S+/i;
            const privateKeyBlock = /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/i;
            const emailAddress = /\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/i;
            const privateDriveReference = /(?:drive\.google\.com|docs\.google\.com\/document\/d\/)/i;
            const unsafe = secretAssignment.test(body) || privateKeyBlock.test(body) || emailAddress.test(body) || privateDriveReference.test(body);
            const knownPackageState = ['NO_PACKAGE','PRIVATE_PACKAGE_PREPARED','INDEPENDENTLY_VERIFIED','APPLIED_BY_REVIEWED_MERGE'].includes(packageState);
            const baseValid = sourceIssue > 0 && currentState === 'SCOPE_DRAFTED' && knownPackageState && keyValid && digestValid && summary && !expired && !unsafe;

            let decision;
            if (!baseValid) decision = 'BLOCKED_INVALID_OR_STALE';
            else if (packageState === 'NO_PACKAGE') decision = 'AWAITING_COUNTERPARTY_EVIDENCE';
            else if (packageState === 'PRIVATE_PACKAGE_PREPARED') decision = 'AWAITING_INDEPENDENT_VERIFICATION';
            else if (packageState === 'INDEPENDENTLY_VERIFIED') decision = 'PRIVATE_ATTESTATION_REVIEW_REQUIRED';
            else decision = 'BLOCKED_APPLICATION_CLAIM_REQUIRES_CANONICAL_EVENT';

            const labels = ['fd-consent-evidence-noncanonical'];
            if (decision === 'AWAITING_COUNTERPARTY_EVIDENCE') labels.push('fd-consent-awaiting-counterparty');
            else if (decision === 'AWAITING_INDEPENDENT_VERIFICATION') labels.push('fd-consent-awaiting-verification');
            else if (decision === 'PRIVATE_ATTESTATION_REVIEW_REQUIRED') labels.push('fd-consent-private-review-required','needs-jp-review');
            else labels.push('fd-consent-blocked','needs-jp-review');

            for (const name of labels) {
              try { await github.rest.issues.getLabel({owner:context.repo.owner,repo:context.repo.repo,name}); }
              catch { await github.rest.issues.createLabel({owner:context.repo.owner,repo:context.repo.repo,name,color:name.includes('blocked')?'B60205':name.includes('awaiting')?'FBCA04':'D4C5F9'}); }
            }
            await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,labels});

            const message = [
              `<!-- ${marker} -->`,
              '**Fardarter Drive™ v6.7 consent evidence receipt**',
              `- Decision: **${decision}**`,
              `- Source entity: **Issue #${sourceIssue || 'UNKNOWN'}**`,
              `- Current canonical state: **${currentState || 'UNKNOWN'}**`,
              `- Claimed private package state: **${packageState || 'UNKNOWN'}**`,
              `- Required gate: **${manifest.currentCanonical.requiredGate}**`,
              `- Reviewer role claim: **${reviewerRole || 'UNKNOWN'}**`,
              `- Verification claim: **${verificationState || 'UNKNOWN'}**`,
              `- Revocation claim: **${revocationState || 'UNKNOWN'}**`,
              `- Public-safe digest supplied: **${attestationDigest === 'NONE' ? 'NO' : 'YES'}**`,
              `- Current event head: **${chain.headSequence}** / \`${chain.headDigest}\``,
              `- Candidate event sequence if later reviewed: **${chain.headSequence + 1}**`,
              `- Current reconciliation: **${reconciliation.sequence}** / \`${reconciliation.snapshotDigest}\``,
              `- Candidate reconciliation sequence if later reviewed: **${reconciliation.sequence + 1}**`,
              '- Canonical event appended: **NO**',
              '- HUMAN_ACCEPTED / order / ACTIVE / gross / settled actual effects: **0 / 0 / 0 / $0 / $0**',
              '',
              'Public claims and metadata digests do not prove another party consented. Private evidence must be independently verified, and any canonical application still requires a separate reviewed append-only merge and immutable readback.',
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,body:message});
