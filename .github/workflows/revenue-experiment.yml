            "receipts/revenue/FARDARTER-DRIVE-CONSENT-ATTESTATION-V6-7.sample.json",
            "receipts/revenue/FARDARTER-DRIVE-GITHUB-FIRST-RESPONSE-V6-9.json",
            "receipts/revenue/FARDARTER-DRIVE-DEPLOYMENT-LINEAGE-V6-10.json",
            "receipts/revenue/FARDARTER-DRIVE-PROMOTION-CANDIDATE-V6-11.json",
            "receipts/revenue/FARDARTER-DRIVE-PRODUCTION-RECONCILIATION-V6-12.json",
            "receipts/revenue/FARDARTER-DRIVE-GDRIVE-V6-13.json",
            "receipts/revenue/FARDARTER-DRIVE-UNIFIED-CONTROL-V6-13.json",
            "receipts/revenue/FARDARTER-DRIVE-PUBLIC-OFFER-V6-14.json",
            "receipts/revenue/FARDARTER-DRIVE-APPLICATION-SURFACE-V6-15.json",
            "receipts/revenue/FARDARTER-DRIVE-AGGREGATE-RECEIPT-V6-16.json",
            "schemas/revenue/fardarter-drive-gdrive-v6.schema.json",
            "schemas/revenue/fardarter-drive-state-event-v6-2.schema.json",
            "schemas/revenue/fardarter-drive-state-events-v6-2.schema.json",
            "schemas/revenue/fardarter-drive-reconciliation-v6-3.schema.json",
            "schemas/revenue/fardarter-drive-canonicalization-previews-v6-4.schema.json",
            "schemas/revenue/fardarter-drive-canonicalization-review-bundle-v6-4.schema.json",
            "schemas/revenue/fardarter-drive-reconciliation-v6-5.schema.json",
            "schemas/revenue/fardarter-drive-canonicalization-application-v6-5.schema.json",
            "schemas/revenue/fardarter-drive-successor-control-v6-6.schema.json",
            "schemas/revenue/fardarter-drive-successor-review-bundle-v6-6.schema.json",
            "schemas/revenue/fardarter-drive-consent-evidence-v6-7.schema.json",
            "schemas/revenue/fardarter-drive-consent-attestation-v6-7.schema.json",
            "schemas/revenue/fardarter-drive-github-first-response-v6-9.schema.json",
            "schemas/revenue/fardarter-drive-deployment-lineage-v6-10.schema.json",
            "schemas/revenue/fardarter-drive-promotion-candidate-v6-11.schema.json",
            "schemas/revenue/fardarter-drive-production-reconciliation-v6-12.schema.json",
            "schemas/revenue/fardarter-drive-gdrive-v6-13.schema.json",
            "schemas/revenue/fardarter-drive-unified-control-v6-13.schema.json",
            "schemas/revenue/fardarter-drive-public-offer-v6-14.schema.json",
            "schemas/revenue/fardarter-drive-application-surface-v6-15.schema.json",
            "schemas/revenue/fardarter-drive-aggregate-receipt-v6-16.schema.json"
          ]) JSON.parse(require("node:fs").readFileSync(path, "utf8")); console.log("Fardarter Drive v6.16 complete aggregate JSON syntax: PASS")'
      - name: Emit reconciled non-financial aggregate receipt
        run: |
          echo "result=PASS"
          echo "drive_id=FARDARTER-DRIVE-V6"
          echo "controller_version=6.16.0"
          echo "aggregate_control=FARDARTER-DRIVE-AGGREGATE-RECEIPT-V6-16"
