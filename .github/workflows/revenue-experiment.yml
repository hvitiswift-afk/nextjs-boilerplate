name: Revenue Experiment Verify

on:
  pull_request:
    paths:
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/control-tower-audit-request.yml"
      - ".github/ISSUE_TEMPLATE/fardarter-*.yml"
      - ".github/workflows/audit-request-intake.yml"
      - ".github/workflows/fardarter-*.yml"
      - ".github/workflows/revenue-experiment.yml"
      - "app/github-control-tower-audit/**"
      - "app/api/revenue/pilot/**"
      - "app/api/revenue/capacity/**"
      - "app/api/revenue/operations/**"
      - "app/api/revenue/reconciliation/**"
      - "app/api/revenue/canonicalization-preview/**"
      - "app/page.tsx"
      - "app/sitemap.ts"
      - "app/robots.ts"
      - "docs/repository/**FARDARTER*"
      - "docs/repository/GITHUB-CONTROL-TOWER-AUDIT-OFFER.md"
      - "examples/github-control-tower-audit-receipt.sample.json"
      - "examples/revenue-experiment.sample.json"
      - "package.json"
      - "receipts/revenue/**"
      - "schemas/revenue/**"
      - "scripts/check-revenue-*.mjs"
      - "scripts/check-fardarter-*.mjs"
      - "src/lib/revenue/**"
      - "src/lib/site-url.ts"
      - "templates/github-control-tower-audit*.md"
      - "templates/fardarter-drive-*.md"
  push:
    branches:
      - main
    paths:
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/control-tower-audit-request.yml"
      - ".github/ISSUE_TEMPLATE/fardarter-*.yml"
      - ".github/workflows/audit-request-intake.yml"
      - ".github/workflows/fardarter-*.yml"
      - ".github/workflows/revenue-experiment.yml"
      - "app/github-control-tower-audit/**"
      - "app/api/revenue/pilot/**"
      - "app/api/revenue/capacity/**"
      - "app/api/revenue/operations/**"
      - "app/api/revenue/reconciliation/**"
      - "app/api/revenue/canonicalization-preview/**"
      - "app/page.tsx"
      - "app/sitemap.ts"
      - "app/robots.ts"
      - "docs/repository/**FARDARTER*"
      - "docs/repository/GITHUB-CONTROL-TOWER-AUDIT-OFFER.md"
      - "examples/github-control-tower-audit-receipt.sample.json"
      - "examples/revenue-experiment.sample.json"
      - "package.json"
      - "receipts/revenue/**"
      - "schemas/revenue/**"
      - "scripts/check-revenue-*.mjs"
      - "scripts/check-fardarter-*.mjs"
      - "src/lib/revenue/**"
      - "src/lib/site-url.ts"
      - "templates/github-control-tower-audit*.md"
      - "templates/fardarter-drive-*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revenue-experiment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Fardarter Drive v6.4 canonicalization previews and review bundles
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate v6.4 authority, capacity, state, proposal, reconciliation, preview, Drive, and product
        run: npm run revenue:verify

      - name: Verify JSON syntax
        run: |
          node -e 'for (const path of ["examples/revenue-experiment.sample.json", "examples/github-control-tower-audit-receipt.sample.json", "receipts/revenue/JP-REV-001-PUBLICATION.json", "receipts/revenue/JP-REV-001-AUTHORITY.json", "receipts/revenue/FARDARTER-DRIVE-V6.json", "receipts/revenue/FARDARTER-DRIVE-AUTHORITY-V6.json", "receipts/revenue/FARDARTER-DRIVE-GDRIVE-V6.json", "receipts/revenue/FARDARTER-DRIVE-CAPACITY-OVERRIDE-V6.sample.json", "receipts/revenue/FARDARTER-DRIVE-CAPACITY-LEDGER-V6-1.json", "receipts/revenue/FARDARTER-DRIVE-STATE-MACHINE-V6-2.json", "receipts/revenue/FARDARTER-DRIVE-STATE-EVENTS-V6-2.json", "receipts/revenue/FARDARTER-DRIVE-EVENT-PROPOSALS-V6-3.json", "receipts/revenue/FARDARTER-DRIVE-RECONCILIATION-V6-3.json", "receipts/revenue/FARDARTER-DRIVE-CANONICALIZATION-PREVIEWS-V6-4.json", "receipts/revenue/FARDARTER-DRIVE-CANONICALIZATION-REVIEW-BUNDLE-V6-4.sample.json", "schemas/revenue/revenue-experiment.schema.json", "schemas/revenue/audit-receipt.schema.json", "schemas/revenue/publication-receipt.schema.json", "schemas/revenue/authority-receipt.schema.json", "schemas/revenue/fardarter-drive-v6.schema.json", "schemas/revenue/fardarter-drive-authority-v6.schema.json", "schemas/revenue/fardarter-drive-gdrive-v6.schema.json", "schemas/revenue/fardarter-drive-capacity-override-v6.schema.json", "schemas/revenue/fardarter-drive-capacity-ledger-v6-1.schema.json", "schemas/revenue/fardarter-drive-state-machine-v6-2.schema.json", "schemas/revenue/fardarter-drive-state-event-v6-2.schema.json", "schemas/revenue/fardarter-drive-state-events-v6-2.schema.json", "schemas/revenue/fardarter-drive-event-proposal-v6-3.schema.json", "schemas/revenue/fardarter-drive-event-proposals-v6-3.schema.json", "schemas/revenue/fardarter-drive-reconciliation-v6-3.schema.json", "schemas/revenue/fardarter-drive-canonicalization-previews-v6-4.schema.json", "schemas/revenue/fardarter-drive-canonicalization-review-bundle-v6-4.schema.json"]) JSON.parse(require("node:fs").readFileSync(path, "utf8")); console.log("Fardarter Drive v6.4 JSON syntax: PASS")'

      - name: Emit non-financial receipt
        run: |
          echo "result=PASS"
          echo "drive_id=FARDARTER-DRIVE-V6"
          echo "controller_version=6.4.0"
          echo "state_machine=FARDARTER-DRIVE-STATE-MACHINE-V6-2"
          echo "event_chain=FARDARTER-DRIVE-STATE-EVENTS-V6-2"
          echo "genesis_digest=4c401dd352d4263786ac22072d616f67775761656a771ea8815e4623a7a3975b"
          echo "canonical_business_events=0"
          echo "proposal_ledger_digest=3c85fe2fc195d5a0c9de45b679f9ef3a5589f36f948ea4a8acc0720483a6dc9e"
          echo "reconciliation_digest=4035cd406a5db019c4f3b9122e0021b2fb3fcbb23e7e10b040333fdedeb41a22"
          echo "candidate_event_digest=2e369ed175bfbd2d2a9ae8cc35ab29a48afc7e25adbfc9591b0127fc2b3fb174"
          echo "candidate_snapshot_digest=4e7e2ead4c466704ad0559fed73cc01cf028722d701ffe47669626858a96c8de"
          echo "review_bundle_digest=3198341aebdf82e95d8cd0de680a16553cf9c3b3c2e4fd4824d197de79aa6ef2"
          echo "preview_ledger_digest=9294df7c63b535b292f163bc1bbc183883d05f7bd99329ed845db9d62e2e7a8c"
          echo "canonicalization_preview_api=/api/revenue/canonicalization-preview"
          echo "control_issue=165"
          echo "total_slots=1000"
          echo "effective_active_ceiling=100"
          echo "active_deliveries=0"
          echo "orders=0"
          echo "verified_revenue_usd=0"
          echo "settled_cash_usd=0"
          echo "preview_auto_application=FALSE"
          echo "canonical_event_requires_reviewed_merge=TRUE"
          echo "received_cash_requires=PAID_SETTLED"
          echo "google_drive_review_bundles=CONNECTED_PRIVATE"
          echo "indemnity_proof_claim=FALSE"
