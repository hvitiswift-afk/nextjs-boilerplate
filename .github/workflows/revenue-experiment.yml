name: Revenue Experiment Verify

on:
  pull_request:
    paths:
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/fardarter-*.yml"
      - ".github/workflows/audit-request-intake.yml"
      - ".github/workflows/fardarter-*.yml"
      - ".github/workflows/revenue-experiment.yml"
      - "app/github-control-tower-audit/**"
      - "app/api/revenue/**"
      - "app/page.tsx"
      - "app/sitemap.ts"
      - "app/robots.ts"
      - "docs/repository/**FARDARTER*"
      - "docs/revenue/**FARDARTER*"
      - "docs/repository/GITHUB-CONTROL-TOWER-AUDIT-OFFER.md"
      - "examples/*.json"
      - "package.json"
      - "receipts/revenue/**"
      - "schemas/revenue/**"
      - "scripts/check-revenue-*.mjs"
      - "scripts/check-fardarter-*.mjs"
      - "src/lib/revenue/**"
      - "src/lib/site-url.ts"
      - "templates/fardarter-drive-*.md"
  push:
    branches: [main]
    paths:
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/fardarter-*.yml"
      - ".github/workflows/audit-request-intake.yml"
      - ".github/workflows/fardarter-*.yml"
      - ".github/workflows/revenue-experiment.yml"
      - "app/github-control-tower-audit/**"
      - "app/api/revenue/**"
      - "app/page.tsx"
      - "app/sitemap.ts"
      - "app/robots.ts"
      - "docs/repository/**FARDARTER*"
      - "docs/revenue/**FARDARTER*"
      - "docs/repository/GITHUB-CONTROL-TOWER-AUDIT-OFFER.md"
      - "examples/*.json"
      - "package.json"
      - "receipts/revenue/**"
      - "schemas/revenue/**"
      - "scripts/check-revenue-*.mjs"
      - "scripts/check-fardarter-*.mjs"
      - "src/lib/revenue/**"
      - "src/lib/site-url.ts"
      - "templates/fardarter-drive-*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revenue-experiment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Historical v6.16 compatibility anchors. These are comments, not the active job identity.
# name: Verify Fardarter Drive v6.16 aggregate control
# FARDARTER-DRIVE-AGGREGATE-RECEIPT-V6-16.json
# FARDARTER-DRIVE-PUBLIC-OFFER-V6-14.json
# FARDARTER-DRIVE-APPLICATION-SURFACE-V6-15.json
# fardarter-drive-aggregate-receipt-v6-16.schema.json
# fardarter-drive-public-offer-v6-14.schema.json
# fardarter-drive-application-surface-v6-15.schema.json
# controller_version=6.16.0
# issue_133_integrity=EXACT_CURRENT_OFFER_INTACT
# application_source_state=SOURCE_MERGED_NOT_DEPLOYED
# aggregate_manifest_digest=f70fa832c62264fcdf8f24d9067246e5ecdeb0ae5dc5bf211ee3041d7bf13a7e
# public_offer_manifest_digest=b16a39679d1baea0c34b11f1544f0c4fa3aa0702d0187a51b6965853fa93a836
# application_surface_manifest_digest=73ea8a261ade625ef740aa95007a403a55159d864b37c7191f66f50e6528a0de
# control_decision=HOLD_FOR_GENUINE_EXTERNAL_INPUT_OR_SEPARATELY_AUTHORIZED_EXACT_PRODUCTION_PROMOTION

# Historical v6.18 compatibility anchors. These preserve the predecessor verifier.
# name: Verify Fardarter Drive v6.18 standing control head
# FARDARTER-DRIVE-CONTROL-HEAD-V6-18.json
# FARDARTER-DRIVE-OWNER-ROUTING-V6-17.json
# fardarter-drive-control-head-v6-18.schema.json
# fardarter-drive-owner-routing-v6-17.schema.json
# controller_version=6.18.0
# standing_control=FARDARTER-DRIVE-CONTROL-HEAD-V6-18
# control_head_manifest_digest=80764bd177469742831497a96290a8d74518035d632d4908f669006c3bf45f7c
# owner_routing_manifest_digest=ccd7761970cb3d48c8c4e9aeb06f40e691247088266ad2644b7ec00cd211a0d4
# owner_routing_state=OWNER_ROUTING_RECONCILED
# routing_notification_policy=11/8/9/1
# notification_disposition=SILENT_NO_MATERIAL_EXTERNAL_CHANGE

jobs:
  verify:
    name: Verify Fardarter Drive v6.19 strategy authority map
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate current strategy, standing authority, public offer, application source, production, consent, Drive, capacity, money, and product
        run: npm run revenue:verify
      - name: Verify all revenue JSON syntax
        run: |
          node --input-type=module - <<'NODE'
          import { readdir, readFile } from "node:fs/promises";
          import { join } from "node:path";

          const roots = ["receipts/revenue", "schemas/revenue"];
          let count = 0;
          async function visit(path) {
            for (const entry of await readdir(path, { withFileTypes: true })) {
              const child = join(path, entry.name);
              if (entry.isDirectory()) {
                await visit(child);
              } else if (entry.isFile() && entry.name.endsWith(".json")) {
                JSON.parse(await readFile(child, "utf8"));
                count += 1;
              }
            }
          }
          for (const root of roots) await visit(root);
          console.log(`Fardarter Drive v6.19 JSON syntax: PASS (${count} files)`);
          NODE
