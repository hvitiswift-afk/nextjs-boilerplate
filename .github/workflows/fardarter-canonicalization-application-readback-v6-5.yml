name: Fardarter Canonicalization Application Readback v6.5

on:
  pull_request:
    paths:
      - ".github/workflows/fardarter-canonicalization-application-readback-v6-5.yml"
      - "app/api/revenue/**"
      - "app/github-control-tower-audit/**"
      - "receipts/revenue/FARDARTER-DRIVE-STATE-EVENTS-V6-2.json"
      - "receipts/revenue/FARDARTER-DRIVE-CAPACITY-LEDGER-V6-1.json"
      - "receipts/revenue/FARDARTER-DRIVE-RECONCILIATION-V6-5.json"
      - "receipts/revenue/FARDARTER-DRIVE-CANONICALIZATION-APPLICATION-V6-5.json"
      - "receipts/revenue/FARDARTER-DRIVE-GDRIVE-V6.json"
      - "schemas/revenue/fardarter-drive-*.json"
      - "scripts/check-fardarter-reviewed-canonicalization-v6-5.mjs"
      - "docs/repository/FARDARTER-DRIVE-V6-5-REVIEWED-CANONICALIZATION.md"
      - "package.json"
      - "app/sitemap.ts"
  workflow_run:
    workflows: [Netlify Audit Product Deploy]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate v6.5 reviewed canonicalization source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run fardarter:current:check
      - run: npm run build

  immutable-readback:
    name: Verify immutable v6.5 application APIs
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Netlify deployment artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: netlify-fardarter-v6-*
          path: deployment-artifacts
          merge-multiple: true

      - name: Resolve immutable deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(find deployment-artifacts -name netlify-deploy-result.json -print -quit)"
          test -n "$RESULT" || { echo "Missing Netlify deploy result"; exit 1; }
          DEPLOY_URL="$(node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(x.deploy_url || x.deploy_ssl_url || x.ssl_url || x.url || "")' "$RESULT")"
          DEPLOY_ID="$(node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(x.deploy_id || x.id || "")' "$RESULT")"
          test -n "$DEPLOY_URL" || { echo "Missing immutable deploy URL"; exit 1; }
          test -n "$DEPLOY_ID" || { echo "Missing deploy ID"; exit 1; }
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Read application surfaces
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          get() { curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 "$1" --output "$2"; }
          get "$DEPLOY_URL/api/revenue/canonicalization-application" application.json
          get "$DEPLOY_URL/api/revenue/operations" operations.json
          get "$DEPLOY_URL/api/revenue/reconciliation" reconciliation.json
          get "$DEPLOY_URL/api/revenue/canonicalization-preview" preview.json
          get "$DEPLOY_URL/github-control-tower-audit/canonicalization-application" application.html
          get "$DEPLOY_URL/sitemap.xml" sitemap.xml

          node <<'NODE'
          const fs = require('node:fs');
          const app = JSON.parse(fs.readFileSync('application.json','utf8'));
          const ops = JSON.parse(fs.readFileSync('operations.json','utf8'));
          const rec = JSON.parse(fs.readFileSync('reconciliation.json','utf8'));
          const preview = JSON.parse(fs.readFileSync('preview.json','utf8'));
          const html = fs.readFileSync('application.html','utf8');
          const sitemap = fs.readFileSync('sitemap.xml','utf8');
          const EVENT = '3859eac9c63bef83624111704d38cf217b0c1a4ece6df874e72a76e9fb1ffc3b';
          const SNAPSHOT = '7c7f47f40868f4879942406274b01710af74539d5b840f0edb18d24400ddbdf3';
          const APPLICATION = '6692334b17fae5e26d973b92d6476a52d4f316489e085eba76971173f03f156f';
          const required = [
            [app.schemaVersion === '1.0.0', 'application.schemaVersion'],
            [app.controllerVersion === '6.5.0', 'application.controllerVersion'],
            [app.applicationDigest === APPLICATION, 'application.digest'],
            [app.canonicalEvent?.sequence === 1, 'application.sequence'],
            [app.canonicalEvent?.eventDigest === EVENT, 'application.eventDigest'],
            [app.canonicalEvent?.canonical === true && app.canonicalEvent?.applied === true, 'application.applied'],
            [app.reconciliation?.snapshotDigest === SNAPSHOT, 'application.snapshotDigest'],
            [app.effects?.stateCountDelta?.SCOPE_DRAFTED === 1, 'application.scopeDelta'],
            [app.effects?.activeDeliveryDelta === 0 && app.effects?.orderDelta === 0, 'application.zeroEffects'],
            [app.currentCanonicalState?.headSequence === 1, 'application.currentHead'],
            [app.currentCanonicalState?.canonicalBusinessEventCount === 1, 'application.businessEvents'],
            [app.currentCanonicalState?.stateCounts?.SCOPE_DRAFTED === 1, 'application.scopeCount'],
            [app.currentCanonicalState?.activeDeliveries === 0 && app.currentCanonicalState?.activeHeadroom === 100, 'application.capacity'],
            [app.currentCanonicalState?.orders === 0 && app.currentCanonicalState?.verifiedGrossRevenueUsd === 0 && app.currentCanonicalState?.verifiedSettledCashUsd === 0, 'application.money'],
            [app.currentCanonicalState?.receivedCashRequires === 'PAID_SETTLED', 'application.cashGate'],
            [app.appendOnlyPolicy?.correctionRequiresNewEvent === true, 'application.appendOnly'],
            [ops.receiptChain?.headSequence === 1 && ops.receiptChain?.canonicalBusinessEventCount === 1, 'operations.head'],
            [ops.receiptChain?.headDigest === EVENT && ops.receiptChain?.genesisOnly === false, 'operations.digest'],
            [ops.canonicalCounts?.SCOPE_DRAFTED === 1, 'operations.scopeCount'],
            [ops.currentApplication?.digest === APPLICATION, 'operations.application'],
            [rec.snapshot?.sequence === 1 && rec.snapshot?.digest === SNAPSHOT, 'reconciliation.snapshot'],
            [rec.canonicalHead?.sequence === 1 && rec.canonicalHead?.canonicalBusinessEventCount === 1, 'reconciliation.head'],
            [rec.currentApplication?.digest === APPLICATION, 'reconciliation.application'],
            [preview.reviewedApplication?.digest === APPLICATION && preview.reviewedApplication?.appliedByReviewedMerge === true, 'preview.application'],
            [preview.canonicalCurrentState?.headSequence === 1 && preview.canonicalCurrentState?.stateCounts?.SCOPE_DRAFTED === 1, 'preview.currentState'],
            [html.includes('Reviewed canonicalization application'), 'application.page'],
            [html.includes('Append-only recovery'), 'application.recovery'],
            [sitemap.includes('/github-control-tower-audit/canonicalization-application'), 'sitemap.route'],
          ];
          const failed = required.filter(([ok]) => !ok).map(([,label]) => label);
          if (failed.length) throw new Error(`v6.5 application readback failed: ${failed.join(', ')}`);
          console.log('Fardarter Drive v6.5 immutable application readback: PASS');
          NODE

      - name: Write v6.5 application receipt
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('fardarter-v6-5-application-readback.json', JSON.stringify({
            schemaVersion: '1.0.0',
            result: 'DEPLOYED_AND_VERIFIED',
            deployId: process.env.DEPLOY_ID,
            deployUrl: process.env.DEPLOY_URL,
            canonicalHeadSequence: 1,
            canonicalBusinessEventCount: 1,
            canonicalEventDigest: '3859eac9c63bef83624111704d38cf217b0c1a4ece6df874e72a76e9fb1ffc3b',
            reconciliationDigest: '7c7f47f40868f4879942406274b01710af74539d5b840f0edb18d24400ddbdf3',
            applicationDigest: '6692334b17fae5e26d973b92d6476a52d4f316489e085eba76971173f03f156f',
            scopeDrafted: 1,
            activeDeliveries: 0,
            orders: 0,
            verifiedGrossRevenueUsd: 0,
            verifiedSettledCashUsd: 0,
            generatedAt: new Date().toISOString(),
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: fardarter-canonicalization-application-v6-5-${{ github.event.workflow_run.head_sha }}
          path: fardarter-v6-5-application-readback.json
          retention-days: 30
