name: MATADATA V2.5 Source Export

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: matadata-v25-source-export
  cancel-in-progress: true

jobs:
  export:
    if: github.head_ref == 'agent/matadata-openai-pathfinder-v2-2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct reviewed V2.5 package without opening OpenAI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matadata-v25 matadata-v25-source
          cat tools/matadata-pathfinder/v22/package.part.* > /tmp/matadata-v25/package.tar.gz
          echo '78c1edc9a4b469f771a9b59742bb1c5f65acadaac2d40d2fd2af4b6a0f284358  /tmp/matadata-v25/package.tar.gz' | sha256sum --check
          tar -xzf /tmp/matadata-v25/package.tar.gz -C /tmp/matadata-v25
          gzip --decompress --stdout /tmp/matadata-v25/runner.cjs.gz > matadata-v25-source/runner.cjs
          echo '6f56edf83efeaec921112c5997d751f7d8a04e810205a7928c1c249906128ab6  matadata-v25-source/runner.cjs' | sha256sum --check
          node --check matadata-v25-source/runner.cjs
          cp -a /tmp/matadata-v25/scripts matadata-v25-source/
          cp /tmp/matadata-v25/MANIFEST.json matadata-v25-source/ 2>/dev/null || true
          sha256sum matadata-v25-source/runner.cjs matadata-v25-source/scripts/* > matadata-v25-source/SHA256SUMS.txt

      - name: Upload V2.5 source for disabled-submit repair
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v25-source
          path: matadata-v25-source
          if-no-files-found: error
          retention-days: 1
