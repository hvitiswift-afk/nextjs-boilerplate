name: Fardarter Canonicalization Preview Readback v6.4

on:
  pull_request:
    paths:
      - ".github/workflows/fardarter-canonicalization-preview-readback-v6-4.yml"
      - "app/api/revenue/canonicalization-preview/**"
      - "app/github-control-tower-audit/canonicalization-preview/**"
      - "receipts/revenue/FARDARTER-DRIVE-CANONICALIZATION-*.json"
      - "receipts/revenue/FARDARTER-DRIVE-RECONCILIATION-V6-5.json"
      - "scripts/check-fardarter-reviewed-canonicalization-v6-5.mjs"
      - "package.json"
  workflow_run:
    workflows: [Netlify Audit Product Deploy]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate historical preview and current application
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run fardarter:current:check
      - run: npm run build

  immutable-readback:
    name: Verify immutable preview history and v6.5 application
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: netlify-fardarter-v6-*
          path: deployment-artifacts
          merge-multiple: true
      - name: Verify preview history
        run: |
          set -euo pipefail
          RESULT="$(find deployment-artifacts -name netlify-deploy-result.json -print -quit)"
          URL="$(node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(x.deploy_url || x.deploy_ssl_url || x.ssl_url || x.url || "")' "$RESULT")"
          test -n "$URL"
          curl --fail --silent --show-error --location "$URL/api/revenue/canonicalization-preview" -o preview.json
          node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('preview.json','utf8'));
          const APPLICATION = 'f2285c4c02c10f4403302600f092926b519d0c2e2c5d0d3e9d078fbf7828be3d';
          const ok = x.previewLedger?.historicalPreparedRecord === true &&
            x.preparedReviewBundle?.historicalOnly === true &&
            x.preparedReviewBundle?.candidateEvent?.canonical === false &&
            x.preparedReviewBundle?.candidateEvent?.applied === false &&
            x.reviewedApplication?.digest === APPLICATION &&
            x.reviewedApplication?.appliedByReviewedMerge === true &&
            x.canonicalCurrentState?.headSequence === 1 &&
            x.canonicalCurrentState?.canonicalBusinessEventCount === 1 &&
            x.canonicalCurrentState?.stateCounts?.SCOPE_DRAFTED === 1 &&
            x.canonicalCurrentState?.activeDeliveries === 0 &&
            x.canonicalCurrentState?.orders === 0 &&
            x.canonicalCurrentState?.verifiedSettledCashUsd === 0;
          if (!ok) throw new Error('Preview history readback failed');
          console.log('Fardarter preview compatibility readback: PASS');
          NODE
