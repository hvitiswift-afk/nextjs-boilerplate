name: Netlify MCP Runnable Export

on:
  push:
    branches:
      - deploy/fardarter-v6-4-exact-20260730
    paths:
      - .github/workflows/netlify-mcp-runnable-export.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: netlify-mcp-runnable-export
  cancel-in-progress: true

jobs:
  export:
    name: Export runnable @netlify/mcp 1.15.1 bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install runnable package tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle export
          cd bundle
          npm init -y >/dev/null
          npm install --omit=dev --ignore-scripts=false --registry=https://registry.npmjs.org @netlify/mcp@1.15.1
          test -x node_modules/.bin/netlify-mcp || {
            echo "Missing node_modules/.bin/netlify-mcp";
            ls -la node_modules/.bin || true;
            exit 1;
          }
          node -e 'const p=require("@netlify/mcp/package.json"); if(p.version!=="1.15.1") throw new Error(`Unexpected version ${p.version}`); console.log(`@netlify/mcp ${p.version}`)'
          cd ..
          tar --sort=name --mtime='UTC 2026-07-30' --owner=0 --group=0 --numeric-owner -czf export/netlify-mcp-1.15.1-runnable.tar.gz bundle
          sha256sum export/netlify-mcp-1.15.1-runnable.tar.gz > export/netlify-mcp-1.15.1-runnable.tar.gz.sha256

      - name: Upload runnable bundle
        uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-1-15-1-runnable-${{ github.run_id }}
          path: export
          if-no-files-found: error
          retention-days: 7

      - name: Publish export receipt
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = `<!-- NETLIFY-MCP-RUNNABLE-${context.runId} -->`;
            const body = `${marker}\n\n## Runnable Netlify MCP bundle ready\n\n` +
              `- Package: \`@netlify/mcp@1.15.1\`\n` +
              `- Workflow run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}\n` +
              `- Artifact: \`netlify-mcp-1-15-1-runnable-${context.runId}\`\n` +
              `- Includes production dependencies and the executable \`node_modules/.bin/netlify-mcp\`.\n` +
              `- No Netlify credential or one-time proxy URL is included.`;
            for (const issue_number of [136,143]) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              if (!comments.some((comment) => comment.body?.includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }
