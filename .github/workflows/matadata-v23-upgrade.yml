name: MATADATA Pathfinder V2.3 Upgrade

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: matadata-v23-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    if: github.head_ref == 'agent/matadata-openai-pathfinder-v2-2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the staged Pathfinder branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Make literal replacement blocks regex-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/matadata-pathfinder/v23/upgrade.py')
          text = path.read_text(encoding='utf-8')
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)'
          if text.count(old) != 1:
              raise SystemExit('regex_once patch target was not found exactly once.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply fail-closed field and acknowledgment upgrade
        shell: bash
        run: |
          set -o pipefail
          python -u tools/matadata-pathfinder/v23/upgrade.py 2>&1 | tee /tmp/matadata-v23-upgrade.log

      - name: Preserve upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v23-upgrade-diagnostics
          path: /tmp/matadata-v23-upgrade.log
          if-no-files-found: warn
          retention-days: 1

      - name: Remove one-time upgrade machinery and commit V2.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/matadata-pathfinder/v23
          rm -f .github/workflows/matadata-v23-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Upgrade MATADATA Pathfinder to V2.3 stable field contract'
          git push origin HEAD:${{ github.head_ref }}
