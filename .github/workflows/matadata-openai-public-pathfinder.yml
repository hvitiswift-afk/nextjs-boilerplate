name: MATADATA OpenAI Human-Gated Pathfinder

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: matadata-openai-human-gated-pathfinder
  cancel-in-progress: true

jobs:
  pathfinder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEY_DIR: /tmp/matadata-pathfinder-key
      WORK_DIR: /tmp/matadata-openai-pathfinder
      ENCRYPTED_PAYLOAD: secure/matadata-openai-application.cms.b64
      APPLICATION_SHA256: 277ef6d685470a024fca4f51ff2eb9e67901dc4dd3eaab285e70efbde0c4a8d1
      PATHFINDER_HUMAN_WINDOW_MS: 900000
    steps:
      - name: Check out isolated Pathfinder branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore PR-scoped one-use application key
        id: key-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/matadata-pathfinder-key
          key: matadata-openai-pathfinder-pr-${{ github.event.pull_request.number }}-v1

      - name: Require cached application key and encrypted payload
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.key-cache.outputs.cache-hit }}" != "true" ]; then
            echo "The PR-scoped private key was not restored. No form will be opened."
            exit 1
          fi
          if [ ! -f "$ENCRYPTED_PAYLOAD" ]; then
            echo "The encrypted application payload is missing. No form will be opened."
            exit 1
          fi

      - name: Install isolated browser and remote-display runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc openbox novnc websockify
          mkdir -p "$WORK_DIR/pathfinder-artifacts"
          cd "$WORK_DIR"
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/tools/matadata-pathfinder/submit-human.mjs" submit-human.mjs
          node --check submit-human.mjs
          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output cloudflared
          chmod 700 cloudflared

      - name: Decrypt and verify private application payload
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          base64 --decode "$GITHUB_WORKSPACE/$ENCRYPTED_PAYLOAD" > application.cms
          openssl cms -decrypt -binary -inform DER \
            -in application.cms \
            -recip "$KEY_DIR/certificate.pem" \
            -inkey "$KEY_DIR/private.pem" \
            -out application.json
          ACTUAL_APPLICATION_SHA="$(sha256sum application.json | awk '{print $1}')"
          if [ "$ACTUAL_APPLICATION_SHA" != "$APPLICATION_SHA256" ]; then
            echo "Application payload integrity check failed. No form will be opened."
            exit 1
          fi
          rm -f application.cms
          echo "PATHFINDER_APPLICATION_PATH=$WORK_DIR/application.json" >> "$GITHUB_ENV"
          echo "Private application payload decrypted and verified only inside the temporary runner."

      - name: Start human-gated remote browser and encrypt handoff
        shell: bash
        env:
          DISPLAY: ':99'
        run: |
          set -euo pipefail
          cd "$WORK_DIR"

          VNC_PASSWORD="$(python - <<'PY'
          import secrets, string
          alphabet = string.ascii_letters + string.digits
          print(''.join(secrets.choice(alphabet) for _ in range(18)))
          PY
          )"
          echo "::add-mask::$VNC_PASSWORD"
          x11vnc -storepasswd "$VNC_PASSWORD" "$WORK_DIR/vnc.pass" >/dev/null

          nohup Xvfb :99 -screen 0 1365x900x24 -ac -noreset >xvfb.log 2>&1 &
          sleep 2
          nohup openbox-session >openbox.log 2>&1 &
          nohup x11vnc -display :99 -rfbauth "$WORK_DIR/vnc.pass" -forever -shared \
            -rfbport 5900 -noxdamage -quiet >x11vnc.log 2>&1 &
          nohup websockify --web=/usr/share/novnc 6080 localhost:5900 >websockify.log 2>&1 &
          nohup "$WORK_DIR/cloudflared" tunnel --url http://127.0.0.1:6080 --no-autoupdate \
            >cloudflared.log 2>&1 &

          TUNNEL_URL=""
          for _ in $(seq 1 90); do
            TUNNEL_URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n1 || true)"
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "Remote-browser tunnel did not become available. No form was opened."
            exit 1
          fi
          echo "::add-mask::$TUNNEL_URL"

          (
            set +e
            DISPLAY=:99 PATHFINDER_HUMAN_WINDOW_MS="$PATHFINDER_HUMAN_WINDOW_MS" \
              node submit-human.mjs >browser.log 2>&1
            echo "$?" > browser.exit
          ) &
          echo "$!" > browser.pid

          cat > handoff.json <<JSON
          {
            "status": "HUMAN_ACTION_REQUIRED",
            "purpose": "Complete OpenAI's provider verification in the temporary remote browser. After the form appears, the bounded runner fills and submits the authorized application once.",
            "remoteBrowserUrl": "$TUNNEL_URL/vnc.html?autoconnect=true&resize=scale",
            "password": "$VNC_PASSWORD",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "expiresWhenJobEnds": true,
            "challengeAutomation": false,
            "submitLimit": 1
          }
          JSON

          openssl cms -encrypt -binary -aes256 \
            -in handoff.json \
            -out handoff.cms \
            -outform DER \
            "$GITHUB_WORKSPACE/tools/matadata-pathfinder/handoff-certificate.pem"
          rm -f handoff.json
          echo "Encrypted human handoff prepared without exposing the URL or password in public logs."

      - name: Upload encrypted human handoff
        uses: actions/upload-artifact@v4
        with:
          name: matadata-openai-human-handoff
          path: /tmp/matadata-openai-pathfinder/handoff.cms
          if-no-files-found: error
          retention-days: 1

      - name: Wait for bounded browser outcome
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          DEADLINE=$(( $(date +%s) + 1000 ))
          while [ ! -f browser.exit ]; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Remote-browser window expired."
              exit 1
            fi
            sleep 2
          done
          EXIT_CODE="$(cat browser.exit)"
          cat browser.log || true
          exit "$EXIT_CODE"

      - name: Upload redacted Pathfinder receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-openai-human-gated-receipt
          path: |
            /tmp/matadata-openai-pathfinder/pathfinder-artifacts
            /tmp/matadata-openai-pathfinder/browser.log
          if-no-files-found: warn
          retention-days: 30
