name: MATADATA Pathfinder Source Inspection

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: matadata-openai-pathfinder-inspect
  cancel-in-progress: true

jobs:
  inspect-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated Pathfinder branch
        uses: actions/checkout@v4

      - name: Reconstruct Pathfinder source without opening the form
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pathfinder-source
          cat \
            tools/matadata-pathfinder/tap-chunks/tap.b64.00 \
            tools/matadata-pathfinder/tap-chunks/tap.b64.01 \
            tools/matadata-pathfinder/tap-chunks/tap.b64.02 \
            tools/matadata-pathfinder/tap-chunks/tap.b64.03 \
            tools/matadata-pathfinder/tap-chunks/tap.b64.04a \
            tools/matadata-pathfinder/tap-chunks/tap.b64.04b \
            tools/matadata-pathfinder/tap-chunks/tap.b64.04c \
            | base64 --decode \
            | gzip --decompress \
            > pathfinder-source/matadata-tap-submit.cjs
          node --check pathfinder-source/matadata-tap-submit.cjs
          sha256sum pathfinder-source/matadata-tap-submit.cjs > pathfinder-source/SHA256SUMS.txt

      - name: Upload reconstructed source for repair
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-source
          path: pathfinder-source
          if-no-files-found: error
          retention-days: 1
