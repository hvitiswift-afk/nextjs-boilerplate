name: Fardarter Reconciliation v6.3 — Historical Read-Only

on:
  pull_request:
    paths:
      - ".github/ISSUE_TEMPLATE/fardarter-event-proposal.yml"
      - ".github/workflows/fardarter-event-proposal-v6-3.yml"
      - ".github/workflows/fardarter-reconciliation-v6-3.yml"
      - ".github/workflows/fardarter-historical-writer-retirement-v6-23.yml"
      - "app/api/revenue/reconciliation/**"
      - "app/github-control-tower-audit/reconciliation/**"
      - "receipts/revenue/FARDARTER-DRIVE-EVENT-PROPOSALS-V6-3.json"
      - "receipts/revenue/FARDARTER-DRIVE-RECONCILIATION-V6-3.json"
      - "receipts/revenue/FARDARTER-DRIVE-HISTORICAL-WRITER-RETIREMENT-V6-23.json"
      - "schemas/revenue/fardarter-drive-event-proposal*.json"
      - "schemas/revenue/fardarter-drive-reconciliation-v6-3.schema.json"
      - "schemas/revenue/fardarter-drive-historical-writer-retirement-v6-23.schema.json"
      - "scripts/check-fardarter-historical-writer-retirement-v6-23.mjs"
      - "src/lib/revenue/public-reconciliation-ledger.ts"
      - "docs/revenue/FARDARTER-DRIVE-HISTORICAL-WRITER-RETIREMENT-V6-23.md"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: fardarter-reconciliation-v6-3-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate retired v6.3 writer and current reconciliation source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fardarter:historical-writer-retirement:check
      - run: npm run build

  diagnose:
    name: Generate read-only current-chain diagnostic artifact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Build stable material diagnostic without public mutation
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const stateMachine = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-STATE-MACHINE-V6-2.json', 'utf8'));
            const eventChain = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-STATE-EVENTS-V6-2.json', 'utf8'));
            const capacity = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-CAPACITY-LEDGER-V6-1.json', 'utf8'));
            const proposalLedger = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-EVENT-PROPOSALS-V6-3.json', 'utf8'));

            const stableStringify = (value) => {
              if (Array.isArray(value)) return `[${value.map(stableStringify).join(',')}]`;
              if (value && typeof value === 'object') {
                return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stableStringify(value[key])}`).join(',')}}`;
              }
              return JSON.stringify(value);
            };
            const digest = (value) => crypto.createHash('sha256').update(stableStringify(value), 'utf8').digest('hex');
            const section = (body, label) => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = (body || '').match(new RegExp(`### ${escaped}\\s*\\n\\n([\\s\\S]*?)(?=\\n### |$)`));
              return match?.[1]?.trim() || '';
            };
            const conflicts = [];
            const addConflict = (type, details = {}) => conflicts.push({ type, ...details });

            if (eventChain.eventCount !== eventChain.events.length) {
              addConflict('EVENT_COUNT_MISMATCH', { declared: eventChain.eventCount, actual: eventChain.events.length });
            }
            if (!eventChain.events.length) addConflict('EMPTY_EVENT_CHAIN');
            for (let index = 0; index < eventChain.events.length; index += 1) {
              const event = eventChain.events[index];
              if (event.sequence !== index) addConflict('EVENT_SEQUENCE_GAP', { index, sequence: event.sequence });
              if (event.canonical !== true) addConflict('NONCANONICAL_EVENT_IN_CANONICAL_CHAIN', { sequence: event.sequence });
              if (index === 0 && event.previousEventDigest !== null) {
                addConflict('GENESIS_PREVIOUS_DIGEST_NOT_NULL');
              }
              if (index > 0 && event.previousEventDigest !== eventChain.events[index - 1].eventDigest) {
                addConflict('PREVIOUS_DIGEST_LINK_MISMATCH', { sequence: event.sequence });
              }
            }
            const lastEvent = eventChain.events.at(-1);
            if (eventChain.headSequence !== lastEvent?.sequence) addConflict('HEAD_SEQUENCE_MISMATCH');
            if (eventChain.headDigest !== lastEvent?.eventDigest) addConflict('HEAD_DIGEST_MISMATCH');
            const derivedBusinessEventCount = eventChain.events.filter(
              (event) => event.canonical === true && event.classification === 'CANONICAL_BUSINESS_EVENT',
            ).length;
            if (eventChain.canonicalBusinessEventCount !== derivedBusinessEventCount) {
              addConflict('CANONICAL_BUSINESS_EVENT_COUNT_MISMATCH', {
                declared: eventChain.canonicalBusinessEventCount,
                derived: derivedBusinessEventCount,
              });
            }

            const openItems = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 },
            );
            const issues = openItems.filter((item) => !item.pull_request);
            const knownStateLabels = new Set(stateMachine.states.map((state) => state.publicLabel));
            const stateCounts = Object.fromEntries(stateMachine.states.map((state) => [state.stateId, 0]));
            const proposalKeys = new Map();
            let openProposalIssues = 0;
            for (const issue of issues) {
              const labels = (issue.labels || []).map((label) => typeof label === 'string' ? label : label.name).filter(Boolean);
              const stateLabels = labels.filter((label) => label.startsWith('fd-state-'));
              const unknownStateLabels = stateLabels.filter((label) => !knownStateLabels.has(label));
              if (unknownStateLabels.length) addConflict('UNKNOWN_STATE_LABEL', { issue: issue.number });
              if (stateLabels.length > 1) addConflict('MULTIPLE_STATE_LABELS', { issue: issue.number });
              if (stateLabels.length === 1 && knownStateLabels.has(stateLabels[0])) {
                const state = stateMachine.states.find((item) => item.publicLabel === stateLabels[0]);
                stateCounts[state.stateId] += 1;
              }

              if (!issue.title.startsWith('[FD event proposal]:')) continue;
              openProposalIssues += 1;
              const key = section(issue.body || '', 'Public-safe idempotency key');
              if (!key || proposalKeys.has(key)) addConflict('DUPLICATE_PROPOSAL_KEY', { issue: issue.number });
              else proposalKeys.set(key, issue.number);
            }

            if (stateCounts.ACTIVE > capacity.canonicalCapacity.effectiveActiveCeiling) {
              addConflict('ACTIVE_CAPACITY_OVERFLOW', {
                publicActiveSignals: stateCounts.ACTIVE,
                ceiling: capacity.canonicalCapacity.effectiveActiveCeiling,
              });
            }

            const sortedConflicts = conflicts
              .map((item) => JSON.parse(stableStringify(item)))
              .sort((a, b) => stableStringify(a).localeCompare(stableStringify(b)));
            const material = {
              diagnosticVersion: '6.23.0',
              historicalController: '6.3.0',
              canonicalHead: {
                sequence: eventChain.headSequence,
                digest: eventChain.headDigest,
                eventCount: eventChain.eventCount,
                canonicalBusinessEventCount: eventChain.canonicalBusinessEventCount,
                derivedBusinessEventCount,
              },
              capacity: {
                totalPlanningSlots: capacity.canonicalCapacity.totalPlanningSlots,
                effectiveActiveCeiling: capacity.canonicalCapacity.effectiveActiveCeiling,
                publicActiveSignals: stateCounts.ACTIVE,
                canonicalActiveDeliveries: capacity.canonicalCapacity.activeDeliveries,
                canonicalActiveHeadroom: capacity.arithmetic.effectiveActiveHeadroom,
              },
              publicStateCounts: stateCounts,
              proposals: {
                openProposalIssues,
                canonicalProposalCount: proposalLedger.proposalCount,
              },
              conflicts: {
                total: sortedConflicts.length,
                items: sortedConflicts,
              },
              commercialEvidence: {
                orders: capacity.canonicalCapacity.orders,
                verifiedGrossRevenueUsd: capacity.financialEvidence.verifiedGrossRevenueUsd,
                verifiedSettledCashUsd: capacity.financialEvidence.verifiedSettledCashUsd,
                receivedCashRequires: capacity.financialEvidence.receivedCashRequires,
              },
            };
            const artifact = {
              schemaVersion: '1.0.0',
              artifactId: 'FARDARTER-RECONCILIATION-V6-3-READONLY-DIAGNOSTIC',
              materialFingerprint: digest(material),
              material,
              generatedAt: new Date().toISOString(),
              publicIssueMutationPerformed: false,
              canonicalMutationPerformed: false,
              providerMutationPerformed: false,
            };
            artifact.artifactDigest = digest(artifact);
            fs.mkdirSync('artifacts', { recursive: true });
            fs.writeFileSync(
              'artifacts/fardarter-reconciliation-v6-3-readonly.json',
              JSON.stringify(artifact, null, 2) + '\n',
            );

            await core.summary
              .addHeading('Fardarter v6.3 historical read-only diagnostic')
              .addRaw(`Material fingerprint: ${artifact.materialFingerprint}\n`)
              .addRaw(`Canonical head: ${material.canonicalHead.sequence} / ${material.canonicalHead.digest}\n`)
              .addRaw(`Canonical business events: ${material.canonicalHead.canonicalBusinessEventCount}\n`)
              .addRaw(`Conflicts: ${material.conflicts.total}\n`)
              .addRaw('Public issue mutation: NO\n')
              .write();

      - name: Upload read-only diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: fardarter-reconciliation-v6-3-readonly
          path: artifacts/fardarter-reconciliation-v6-3-readonly.json
          retention-days: 30
