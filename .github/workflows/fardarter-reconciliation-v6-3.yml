name: Fardarter Reconciliation v6.3

on:
  pull_request:
    paths:
      - ".github/ISSUE_TEMPLATE/fardarter-event-proposal.yml"
      - ".github/workflows/fardarter-event-proposal-v6-3.yml"
      - ".github/workflows/fardarter-reconciliation-v6-3.yml"
      - "app/api/revenue/reconciliation/**"
      - "app/github-control-tower-audit/reconciliation/**"
      - "receipts/revenue/FARDARTER-DRIVE-EVENT-PROPOSALS-V6-3.json"
      - "receipts/revenue/FARDARTER-DRIVE-RECONCILIATION-V6-3.json"
      - "schemas/revenue/fardarter-drive-event-proposal*.json"
      - "schemas/revenue/fardarter-drive-reconciliation-v6-3.schema.json"
      - "scripts/check-fardarter-reconciliation-v6-3.mjs"
      - "src/lib/revenue/public-reconciliation-ledger.ts"
      - "package.json"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fardarter-reconciliation-v6-3-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate v6.3 proposal and reconciliation source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run fardarter:reconciliation:check
      - run: npm run build

  reconcile:
    name: Generate public-safe reconciliation artifact
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Reconcile public signals, proposals, and canonical source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const stateMachine = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-STATE-MACHINE-V6-2.json', 'utf8'));
            const eventChain = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-STATE-EVENTS-V6-2.json', 'utf8'));
            const capacity = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-CAPACITY-LEDGER-V6-1.json', 'utf8'));
            const proposalLedger = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-EVENT-PROPOSALS-V6-3.json', 'utf8'));
            const genesisSnapshot = JSON.parse(fs.readFileSync('receipts/revenue/FARDARTER-DRIVE-RECONCILIATION-V6-3.json', 'utf8'));

            const stableStringify = (value) => {
              if (Array.isArray(value)) return `[${value.map(stableStringify).join(',')}]`;
              if (value && typeof value === 'object') {
                return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stableStringify(value[key])}`).join(',')}}`;
              }
              return JSON.stringify(value);
            };
            const digest = (value) => crypto.createHash('sha256').update(stableStringify(value), 'utf8').digest('hex');
            const section = (body, label) => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = (body || '').match(new RegExp(`### ${escaped}\\s*\\n\\n([\\s\\S]*?)(?=\\n### |$)`));
              return match?.[1]?.trim() || '';
            };

            const openItems = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 },
            );
            const issues = openItems.filter((item) => !item.pull_request);
            const knownStateLabels = new Set(stateMachine.states.map((state) => state.publicLabel));
            const knownStates = new Set(stateMachine.states.map((state) => state.stateId));
            const allowedTransitions = new Set(
              stateMachine.allowedTransitions.map((item) => `${item.fromState}->${item.toState}`),
            );
            const stateCounts = Object.fromEntries(stateMachine.states.map((state) => [state.stateId, 0]));
            const conflicts = [];
            const proposalKeys = new Map();
            const proposalDecisionCounts = {
              PROPOSED: 0,
              READY_FOR_REVIEW: 0,
              QUARANTINED: 0,
              REJECTED: 0,
              CANONICALIZED_BY_REVIEWED_MERGE: 0,
            };

            for (const issue of issues) {
              const labels = (issue.labels || []).map((label) => typeof label === 'string' ? label : label.name).filter(Boolean);
              const stateLabels = labels.filter((label) => label.startsWith('fd-state-'));
              const unknownStateLabels = stateLabels.filter((label) => !knownStateLabels.has(label));
              if (unknownStateLabels.length) conflicts.push({ issue: issue.number, type: 'UNKNOWN_STATE_LABEL' });
              if (stateLabels.length > 1) conflicts.push({ issue: issue.number, type: 'MULTIPLE_STATE_LABELS' });
              if (stateLabels.length === 1 && knownStateLabels.has(stateLabels[0])) {
                const state = stateMachine.states.find((item) => item.publicLabel === stateLabels[0]);
                stateCounts[state.stateId] += 1;
              }

              if (!issue.title.startsWith('[FD event proposal]:')) continue;
              const body = issue.body || '';
              const sourceIssue = Number(section(body, 'Source issue or public-safe entity reference').match(/Issue\s*#(\d+)/i)?.[1] || 0);
              const expected = section(body, 'Expected current public signal state');
              const fromState = section(body, 'Proposed canonical from-state');
              const toState = section(body, 'Proposed canonical to-state');
              const key = section(body, 'Public-safe idempotency key');
              const reviewBy = Date.parse(section(body, 'Review-by or expiry time'));
              const decisionLabels = labels.filter((label) => [
                'fd-proposal-ready-for-review', 'fd-proposal-quarantined'
              ].includes(label));
              if (decisionLabels.includes('fd-proposal-ready-for-review')) proposalDecisionCounts.READY_FOR_REVIEW += 1;
              else if (decisionLabels.includes('fd-proposal-quarantined')) proposalDecisionCounts.QUARANTINED += 1;
              else proposalDecisionCounts.PROPOSED += 1;
              if (decisionLabels.length > 1) conflicts.push({ issue: issue.number, type: 'PROPOSAL_DECISION_CONFLICT' });
              if (!key || proposalKeys.has(key)) conflicts.push({ issue: issue.number, type: 'DUPLICATE_PROPOSAL_KEY' });
              else proposalKeys.set(key, issue.number);
              if (!Number.isFinite(reviewBy) || reviewBy <= Date.now()) conflicts.push({ issue: issue.number, type: 'STALE_OR_EXPIRED_PROPOSAL' });
              if (!knownStates.has(expected) || expected !== fromState || !allowedTransitions.has(`${fromState}->${toState}`)) {
                conflicts.push({ issue: issue.number, type: 'INVALID_TRANSITION' });
              }
              if (sourceIssue > 0) {
                try {
                  const target = await github.rest.issues.get({ owner, repo, issue_number: sourceIssue });
                  const targetLabels = (target.data.labels || [])
                    .map((label) => typeof label === 'string' ? label : label.name)
                    .filter((label) => label?.startsWith('fd-state-'));
                  const expectedLabel = stateMachine.states.find((item) => item.stateId === expected)?.publicLabel;
                  if (targetLabels.length !== 1 || targetLabels[0] !== expectedLabel) {
                    conflicts.push({ issue: issue.number, type: 'PUBLIC_CANONICAL_DRIFT' });
                  }
                } catch {
                  conflicts.push({ issue: issue.number, type: 'SOURCE_ENTITY_UNAVAILABLE' });
                }
              }
            }

            if (stateCounts.ACTIVE > capacity.canonicalCapacity.effectiveActiveCeiling) {
              conflicts.push({ issue: 160, type: 'ACTIVE_CAPACITY_OVERFLOW' });
            }
            const canonicalHealthy =
              eventChain.eventCount === eventChain.events.length &&
              eventChain.headSequence === eventChain.events.at(-1)?.sequence &&
              eventChain.headDigest === eventChain.events.at(-1)?.eventDigest &&
              eventChain.canonicalBusinessEventCount === 0;
            if (!canonicalHealthy) conflicts.push({ issue: 160, type: 'BROKEN_EVENT_CHAIN' });

            const snapshot = {
              schemaVersion: '1.0.0',
              snapshotId: `FARDARTER-RECONCILIATION-RUNTIME-V6-3-${context.runId}`,
              sequence: 1,
              previousSnapshotDigest: genesisSnapshot.snapshotDigest,
              controllerVersion: '6.3.0',
              canonicalHead: {
                sequence: eventChain.headSequence,
                digest: eventChain.headDigest,
                healthy: canonicalHealthy,
                canonicalBusinessEventCount: eventChain.canonicalBusinessEventCount,
              },
              capacity: {
                totalPlanningSlots: capacity.canonicalCapacity.totalPlanningSlots,
                effectiveActiveCeiling: capacity.canonicalCapacity.effectiveActiveCeiling,
                publicActiveSignals: stateCounts.ACTIVE,
                canonicalActiveDeliveries: capacity.canonicalCapacity.activeDeliveries,
                canonicalActiveHeadroom: capacity.arithmetic.effectiveActiveHeadroom,
              },
              publicStateCounts: stateCounts,
              proposals: {
                openProposalIssues: issues.filter((issue) => issue.title.startsWith('[FD event proposal]:')).length,
                decisionCounts: proposalDecisionCounts,
                canonicalProposalCount: proposalLedger.proposalCount,
              },
              conflicts: {
                total: conflicts.length,
                items: conflicts,
              },
              commercialEvidence: {
                orders: capacity.canonicalCapacity.orders,
                verifiedGrossRevenueUsd: capacity.financialEvidence.verifiedGrossRevenueUsd,
                verifiedSettledCashUsd: capacity.financialEvidence.verifiedSettledCashUsd,
                receivedCashRequires: capacity.financialEvidence.receivedCashRequires,
              },
              deploymentState: 'UNVERIFIED',
              generatedAt: new Date().toISOString(),
            };
            snapshot.snapshotDigest = digest(snapshot);
            fs.mkdirSync('artifacts', { recursive: true });
            fs.writeFileSync(
              'artifacts/fardarter-reconciliation-runtime-v6-3.json',
              JSON.stringify(snapshot, null, 2) + '\n',
            );

            await core.summary
              .addHeading('Fardarter Drive v6.3 reconciliation')
              .addRaw(`Snapshot digest: ${snapshot.snapshotDigest}\n`)
              .addRaw(`Canonical head: ${snapshot.canonicalHead.sequence} / ${snapshot.canonicalHead.digest}\n`)
              .addRaw(`Open proposals: ${snapshot.proposals.openProposalIssues}\n`)
              .addRaw(`Conflicts: ${snapshot.conflicts.total}\n`)
              .write();

            if (conflicts.length) {
              const marker = `<!-- jp-fardarter-reconciliation-v6-3-${snapshot.snapshotDigest} -->`;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: 160, per_page: 100 },
              );
              if (!comments.some((comment) => comment.body?.includes(marker))) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: 160,
                  body: `${marker}\n**Fardarter Drive™ v6.3 reconciliation conflict receipt**\n\n- Snapshot digest: \`${snapshot.snapshotDigest}\`\n- Conflicts: **${conflicts.length}**\n- Canonical event appended: **NO**\n- Canonical mutation: **FROZEN**\n- Orders / verified gross / settled cash: **0 / $0 / $0 canonical baseline**\n\nReview the public-safe conflict artifact and the private quarantine register. Do not copy sensitive evidence into GitHub.`,
                });
              }
            }

      - name: Upload reconciliation artifact
        uses: actions/upload-artifact@v4
        with:
          name: fardarter-reconciliation-v6-3-${{ github.run_id }}
          path: artifacts/fardarter-reconciliation-runtime-v6-3.json
          retention-days: 30
