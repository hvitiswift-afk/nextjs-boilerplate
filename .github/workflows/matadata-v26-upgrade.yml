name: MATADATA Pathfinder V2.6 Upgrade

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: matadata-v26-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    if: github.head_ref == 'agent/matadata-openai-pathfinder-v2-2'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out the staged Pathfinder branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Ensure patch utility is available
        shell: bash
        run: command -v patch || (sudo apt-get update -qq && sudo apt-get install -y patch)

      - name: Apply and verify the V2.6 disabled-submit recovery
        shell: bash
        run: |
          set -o pipefail
          python -u tools/matadata-pathfinder/v26/upgrade.py 2>&1 | tee /tmp/matadata-v26-upgrade.log

      - name: Package the verified generated V2.6 repository delta
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/matadata-v26-generated
          rm -rf "$root"
          mkdir -p "$root/.github/workflows" "$root/tools/matadata-pathfinder/v22"
          cp .github/workflows/matadata-openai-pathfinder-v22.yml "$root/.github/workflows/"
          cp tools/matadata-pathfinder/v22/package.part.* "$root/tools/matadata-pathfinder/v22/"
          cp tools/matadata-pathfinder/v22/README.md "$root/tools/matadata-pathfinder/v22/"
          cp tools/matadata-pathfinder/v22/MANIFEST.json "$root/tools/matadata-pathfinder/v22/"
          cp tools/matadata-pathfinder/v22/V26_UPGRADE_RECEIPT.json "$root/tools/matadata-pathfinder/v22/"
          cat > "$root/DELETE_PATHS.txt" <<'EOF'
          .github/workflows/matadata-v25-submit-disabled-snapshot.yml
          .github/workflows/matadata-v25-source-export.yml
          .github/workflows/matadata-v25-high-screen.yml
          .github/workflows/matadata-v26-upgrade.yml
          tools/matadata-pathfinder/v26/upgrade.py
          tools/matadata-pathfinder/v26/patch/v26.patch.gz.b64.00
          tools/matadata-pathfinder/v26/patch/v26.patch.gz.b64.01
          tools/matadata-pathfinder/v26/patch/v26.patch.gz.b64.02
          EOF
          find "$root" -type f -print0 | sort -z | xargs -0 sha256sum > "$root/GENERATED_SHA256SUMS.txt"
          tar -C "$root" -czf /tmp/matadata-v26-generated.tar.gz .
          sha256sum /tmp/matadata-v26-generated.tar.gz > /tmp/matadata-v26-generated.tar.gz.sha256

      - name: Preserve upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v26-upgrade-diagnostics
          path: /tmp/matadata-v26-upgrade.log
          if-no-files-found: warn
          retention-days: 1

      - name: Upload the verified generated V2.6 delta
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v26-generated
          path: |
            /tmp/matadata-v26-generated.tar.gz
            /tmp/matadata-v26-generated.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
