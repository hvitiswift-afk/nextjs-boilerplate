name: Fardarter Drive v6.4 Actions Probe

on:
  push:
    branches:
      - deploy/fardarter-v6-4-exact-20260730
    paths:
      - .github/workflows/fardarter-v6-4-actions-probe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report branch workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch: 'deploy/fardarter-v6-4-exact-20260730',
              event: 'push',
              per_page: 30,
            });
            const runs = response.data.workflow_runs.map((run) => ({
              id: run.id,
              name: run.name,
              status: run.status,
              conclusion: run.conclusion,
              head_sha: run.head_sha,
              created_at: run.created_at,
              updated_at: run.updated_at,
              url: run.html_url,
            }));
            const marker = `<!-- FARDARTER-V6-4-ACTIONS-PROBE-${context.runId} -->`;
            const body = `${marker}\n\n## Exact v6.4 Actions probe\n\n` +
              `Probe run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}\n\n` +
              `\`\`\`json\n${JSON.stringify(runs, null, 2)}\n\`\`\``;
            await github.rest.issues.createComment({ owner, repo, issue_number: 136, body });
