name: MATADATA V2.5 Submit Disabled Snapshot

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: matadata-v25-submit-disabled-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.head_ref == 'agent/matadata-openai-pathfinder-v2-2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '30239642524'
    steps:
      - uses: actions/checkout@v4

      - name: Download active V2.5 session handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matadata-v25-session /tmp/matadata-v25-snapshot
          artifact_id="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "matadata-pathfinder-v25-live-session") | .id' | head -n1)"
          test -n "$artifact_id"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > /tmp/matadata-v25-session/session.zip
          unzip -q /tmp/matadata-v25-session/session.zip -d /tmp/matadata-v25-session/content

      - name: Fetch and sanitize current page and status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/matadata-v25-session/url.txt
          import json
          from pathlib import Path
          files = list(Path('/tmp/matadata-v25-session/content').rglob('*.json'))
          if not files:
              raise SystemExit('No session JSON found.')
          payload = json.loads(files[0].read_text(encoding='utf-8'))
          for key in ('primary_url', 'url', 'primaryUrl'):
              if payload.get(key):
                  print(payload[key])
                  break
          else:
              raise SystemExit(f'No primary URL; keys={sorted(payload)}')
          PY
          url="$(cat /tmp/matadata-v25-session/url.txt)"
          base="${url%%\?*}"
          curl --fail --location --silent --show-error --max-time 25 \
            --cookie-jar /tmp/matadata-v25-session/cookies.txt \
            --cookie /tmp/matadata-v25-session/cookies.txt \
            "$url" > /tmp/matadata-v25-session/page.html
          curl --fail --location --silent --show-error --max-time 25 \
            --cookie /tmp/matadata-v25-session/cookies.txt \
            "${base%/}/status" > /tmp/matadata-v25-session/status.json

          python - <<'PY'
          from html import unescape
          from pathlib import Path
          import hashlib, json, re

          def redact_string(value):
              value = re.sub(r'https://[-a-z0-9]+\.trycloudflare\.com', 'https://<redacted>.trycloudflare.com', value, flags=re.I)
              value = re.sub(r'(?i)(token=)[A-Za-z0-9]+', r'\1<redacted>', value)
              value = re.sub(r'\b[0-9a-fA-F]{24,}\b', '<redacted-hex>', value)
              value = re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '<redacted-email>', value)
              return value

          sensitive = {'token','screenToken','sessionToken','cookie','email','linkedin','application','proposal','problem','timeline','funding','personnel','additionalNotes'}
          def sanitize(value, key=''):
              if key in sensitive:
                  if isinstance(value, str):
                      return {'redacted': True, 'field': key, 'length': len(value), 'sha256': hashlib.sha256(value.encode()).hexdigest()}
                  return {'redacted': True, 'field': key}
              if isinstance(value, dict):
                  return {k: sanitize(v, k) for k, v in value.items()}
              if isinstance(value, list):
                  return [sanitize(v, key) for v in value]
              if isinstance(value, str):
                  return redact_string(value)
              return value

          raw = Path('/tmp/matadata-v25-session/status.json').read_text(encoding='utf-8', errors='replace')
          status = json.loads(raw)
          Path('/tmp/matadata-v25-snapshot/status.json').write_text(json.dumps(sanitize(status), indent=2) + '\n', encoding='utf-8')

          html = Path('/tmp/matadata-v25-session/page.html').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'<script\b[^>]*>.*?</script>', ' ', html, flags=re.I|re.S)
          text = re.sub(r'<style\b[^>]*>.*?</style>', ' ', text, flags=re.I|re.S)
          text = unescape(re.sub(r'<[^>]+>', '\n', text))
          lines = [re.sub(r'\s+', ' ', line).strip() for line in text.splitlines()]
          lines = [line for line in lines if line]
          keep = re.compile(r'submit|disable|invalid|validat|acknowledg|phase|status|error|message|field|captcha|verification|turnstile|token', re.I)
          selected = [redact_string(line) for line in lines if keep.search(line)]
          Path('/tmp/matadata-v25-snapshot/page-status.txt').write_text('\n'.join(selected[:250]) + '\n', encoding='utf-8')
          Path('/tmp/matadata-v25-snapshot/page-html-sha256.txt').write_text(hashlib.sha256(html.encode()).hexdigest() + '\n', encoding='utf-8')
          PY

      - name: Upload sanitized disabled-submit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: matadata-v25-submit-disabled-snapshot
          path: /tmp/matadata-v25-snapshot
          if-no-files-found: error
          retention-days: 1
