name: Fardarter Reconciliation Readback v6.3

on:
  pull_request:
    paths:
      - ".github/workflows/fardarter-reconciliation-readback-v6-3.yml"
      - "app/api/revenue/reconciliation/**"
      - "app/github-control-tower-audit/reconciliation/**"
      - "receipts/revenue/FARDARTER-DRIVE-RECONCILIATION-V6-5.json"
      - "receipts/revenue/FARDARTER-DRIVE-CANONICALIZATION-APPLICATION-V6-5.json"
      - "scripts/check-fardarter-reviewed-canonicalization-v6-5.mjs"
      - "package.json"
  workflow_run:
    workflows: [Netlify Audit Product Deploy]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate current reconciliation source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run fardarter:current:check
      - run: npm run build

  immutable-readback:
    name: Verify immutable reconciliation API at sequence 1
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: netlify-fardarter-v6-*
          path: deployment-artifacts
          merge-multiple: true
      - name: Verify current reconciliation
        run: |
          set -euo pipefail
          RESULT="$(find deployment-artifacts -name netlify-deploy-result.json -print -quit)"
          URL="$(node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(x.deploy_url || x.deploy_ssl_url || x.ssl_url || x.url || "")' "$RESULT")"
          test -n "$URL"
          curl --fail --silent --show-error --location "$URL/api/revenue/reconciliation" -o reconciliation.json
          node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('reconciliation.json','utf8'));
          const EVENT = '3859eac9c63bef83624111704d38cf217b0c1a4ece6df874e72a76e9fb1ffc3b';
          const SNAPSHOT = '7c7f47f40868f4879942406274b01710af74539d5b840f0edb18d24400ddbdf3';
          const APPLICATION = '6692334b17fae5e26d973b92d6476a52d4f316489e085eba76971173f03f156f';
          const ok = x.snapshot?.sequence === 1 && x.snapshot?.digest === SNAPSHOT &&
            x.canonicalHead?.sequence === 1 && x.canonicalHead?.digest === EVENT &&
            x.canonicalHead?.canonicalBusinessEventCount === 1 &&
            x.canonicalCounts?.SCOPE_DRAFTED === 1 &&
            x.currentApplication?.digest === APPLICATION &&
            x.capacity?.activeDeliveries === 0 && x.capacity?.activeHeadroom === 100 &&
            x.commercialEvidence?.orders === 0 && x.commercialEvidence?.verifiedSettledCashUsd === 0;
          if (!ok) throw new Error('Current reconciliation readback failed');
          console.log('Fardarter reconciliation compatibility readback: PASS');
          NODE
