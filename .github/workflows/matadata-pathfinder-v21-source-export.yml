name: MATADATA Pathfinder V2.1 Source Export

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: matadata-pathfinder-v21-source-export
  cancel-in-progress: true

jobs:
  export-source:
    if: github.head_ref == 'agent/matadata-openai-pathfinder-v2-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct V2.1 source without opening OpenAI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pathfinder-source
          cat tools/matadata-pathfinder/v2/runner.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > pathfinder-source/matadata-pathfinder-v21.cjs
          echo '738ccace37392a064eb37bd1b360a292199cb1bad94b0a656e899f03d43ab13c  pathfinder-source/matadata-pathfinder-v21.cjs' \
            | sha256sum --check
          node --check pathfinder-source/matadata-pathfinder-v21.cjs
          sha256sum pathfinder-source/matadata-pathfinder-v21.cjs > pathfinder-source/SHA256SUMS.txt
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v21-source
          path: pathfinder-source
          if-no-files-found: error
          retention-days: 1
