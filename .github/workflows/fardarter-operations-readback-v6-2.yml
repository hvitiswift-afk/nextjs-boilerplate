name: Fardarter Operations Readback v6.2

on:
  pull_request:
    paths:
      - ".github/workflows/fardarter-operations-readback-v6-2.yml"
      - "app/api/revenue/operations/**"
      - "receipts/revenue/FARDARTER-DRIVE-STATE-EVENTS-V6-2.json"
      - "receipts/revenue/FARDARTER-DRIVE-CANONICALIZATION-APPLICATION-V6-5.json"
      - "scripts/check-fardarter-reviewed-canonicalization-v6-5.mjs"
      - "package.json"
  workflow_run:
    workflows: [Netlify Audit Product Deploy]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate current operations receipt mesh
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run fardarter:current:check
      - run: npm run build

  immutable-readback:
    name: Verify immutable operations API at sequence 1
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: netlify-fardarter-v6-*
          path: deployment-artifacts
          merge-multiple: true
      - name: Verify current operations state
        run: |
          set -euo pipefail
          RESULT="$(find deployment-artifacts -name netlify-deploy-result.json -print -quit)"
          URL="$(node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(x.deploy_url || x.deploy_ssl_url || x.ssl_url || x.url || "")' "$RESULT")"
          test -n "$URL"
          curl --fail --silent --show-error --location "$URL/api/revenue/operations" -o operations.json
          node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('operations.json','utf8'));
          const EVENT = '3859eac9c63bef83624111704d38cf217b0c1a4ece6df874e72a76e9fb1ffc3b';
          const ok = x.receiptChain?.headSequence === 1 &&
            x.receiptChain?.canonicalBusinessEventCount === 1 &&
            x.receiptChain?.headDigest === EVENT &&
            x.receiptChain?.genesisOnly === false &&
            x.canonicalCounts?.SCOPE_DRAFTED === 1 &&
            x.capacity?.activeDeliveries === 0 &&
            x.capacity?.activeHeadroom === 100 &&
            x.commercialEvidence?.orders === 0 &&
            x.commercialEvidence?.verifiedSettledCashUsd === 0;
          if (!ok) throw new Error('Current operations readback failed');
          console.log('Fardarter operations compatibility readback: PASS');
          NODE
