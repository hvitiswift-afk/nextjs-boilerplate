name: MATADATA Pathfinder V2.1 Upgrade

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: matadata-pathfinder-v21-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/matadata-openai-pathfinder-v2-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the staged Pathfinder branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Ensure patch utility is available
        run: command -v patch || (sudo apt-get update -qq && sudo apt-get install -y patch)

      - name: Normalize transport-only whitespace in encoded chunks
        shell: bash
        run: |
          set -euo pipefail
          for file in tools/matadata-pathfinder/v2/runner.b64.* tools/matadata-pathfinder/v2/upgrade/v21.patch.b64.*; do
            tr -d '[:space:]' < "$file" > "$file.clean"
            mv "$file.clean" "$file"
          done

      - name: Stabilize deterministic gzip across Python versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/matadata-pathfinder/v2/upgrade/apply_v21.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import hashlib\n', 'import hashlib\nimport io\n', 1)
          old = '        compressed = gzip.compress(new_source, compresslevel=9, mtime=0)\n        encoded = base64.b64encode(compressed)'
          new = '''        buffer = io.BytesIO()
          with gzip.GzipFile(filename="", mode="wb", fileobj=buffer, compresslevel=9, mtime=0) as archive:
              archive.write(new_source)
          compressed = buffer.getvalue()
          encoded = base64.b64encode(compressed)'''
          if old not in text:
              raise SystemExit('Deterministic gzip patch target was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply and validate the checksum-locked acknowledgment repair
        shell: bash
        run: |
          set -o pipefail
          {
            echo 'PATCH CHUNK SIZES'
            wc -c tools/matadata-pathfinder/v2/upgrade/v21.patch.b64.*
            echo 'PATCH CHUNK HASHES'
            sha256sum tools/matadata-pathfinder/v2/upgrade/v21.patch.b64.*
            echo 'PATCH CONCATENATED BASE64 HASH'
            cat tools/matadata-pathfinder/v2/upgrade/v21.patch.b64.* | sha256sum
            echo 'PATCH DECODED GZIP HASH'
            cat tools/matadata-pathfinder/v2/upgrade/v21.patch.b64.* | base64 --decode | sha256sum
            echo 'PATCH DECOMPRESSED HASH'
            cat tools/matadata-pathfinder/v2/upgrade/v21.patch.b64.* | base64 --decode | gzip --decompress | sha256sum
          } 2>&1 | tee /tmp/matadata-v21-upgrade.log
          python -u tools/matadata-pathfinder/v2/upgrade/apply_v21.py 2>&1 | tee -a /tmp/matadata-v21-upgrade.log

      - name: Preserve upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v21-upgrade-diagnostics
          path: /tmp/matadata-v21-upgrade.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit the staged V2.1 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Upgrade MATADATA Pathfinder to V2.1 acknowledgment proxy'
          git push origin HEAD:${{ github.head_ref }}
