name: MATADATA Pathfinder V2.1 Upgrade

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: matadata-pathfinder-v21-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/matadata-openai-pathfinder-v2-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the staged Pathfinder branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Ensure patch utility is available
        run: command -v patch || (sudo apt-get update -qq && sudo apt-get install -y patch)

      - name: Apply and validate the checksum-locked acknowledgment repair
        shell: bash
        run: |
          set -o pipefail
          python -u tools/matadata-pathfinder/v2/upgrade/apply_v21.py 2>&1 | tee /tmp/matadata-v21-upgrade.log

      - name: Preserve upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v21-upgrade-diagnostics
          path: /tmp/matadata-v21-upgrade.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit the staged V2.1 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Upgrade MATADATA Pathfinder to V2.1 acknowledgment proxy'
          git push origin HEAD:${{ github.head_ref }}
