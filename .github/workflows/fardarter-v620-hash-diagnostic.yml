name: Fardarter v6.20 Hash Diagnostic

on:
  pull_request:
    paths:
      - "app/github-control-tower-audit/current/page.tsx"
      - "app/api/revenue/pilot/current/route.ts"
      - "next.config.ts"
      - ".github/workflows/fardarter-v620-hash-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hashes:
    name: Print exact v6.20 source hashes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print SHA-256 values
        run: sha256sum app/github-control-tower-audit/current/page.tsx app/api/revenue/pilot/current/route.ts next.config.ts
