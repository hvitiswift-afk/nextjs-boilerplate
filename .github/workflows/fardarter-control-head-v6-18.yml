name: Fardarter Control Head v6.18

on:
  pull_request:
    paths:
      - ".github/workflows/fardarter-control-head-v6-18.yml"
      - ".github/workflows/revenue-experiment.yml"
      - "docs/revenue/FARDARTER-DRIVE-CONTROL-HEAD-V6-18.md"
      - "package.json"
      - "receipts/revenue/FARDARTER-DRIVE-CONTROL-HEAD-V6-18.json"
      - "receipts/revenue/FARDARTER-DRIVE-AGGREGATE-RECEIPT-V6-16.json"
      - "receipts/revenue/FARDARTER-DRIVE-OWNER-ROUTING-V6-17.json"
      - "schemas/revenue/fardarter-drive-control-head-v6-18.schema.json"
      - "schemas/revenue/fardarter-drive-aggregate-receipt-v6-16.schema.json"
      - "schemas/revenue/fardarter-drive-owner-routing-v6-17.schema.json"
      - "scripts/check-fardarter-control-head-v6-18.mjs"
      - "scripts/check-fardarter-revenue-receipt-v6-16.mjs"
      - "scripts/check-fardarter-owner-routing-v6-17.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fardarter-control-head-v6-18.yml"
      - ".github/workflows/revenue-experiment.yml"
      - "docs/revenue/FARDARTER-DRIVE-CONTROL-HEAD-V6-18.md"
      - "package.json"
      - "receipts/revenue/FARDARTER-DRIVE-CONTROL-HEAD-V6-18.json"
      - "receipts/revenue/FARDARTER-DRIVE-AGGREGATE-RECEIPT-V6-16.json"
      - "receipts/revenue/FARDARTER-DRIVE-OWNER-ROUTING-V6-17.json"
      - "schemas/revenue/fardarter-drive-control-head-v6-18.schema.json"
      - "schemas/revenue/fardarter-drive-aggregate-receipt-v6-16.schema.json"
      - "schemas/revenue/fardarter-drive-owner-routing-v6-17.schema.json"
      - "scripts/check-fardarter-control-head-v6-18.mjs"
      - "scripts/check-fardarter-revenue-receipt-v6-16.mjs"
      - "scripts/check-fardarter-owner-routing-v6-17.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fardarter-control-head-v6-18-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify standing control head v6.18
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify v6.18 standing control head
        run: npm run fardarter:control-head:check
      - name: Verify exact JSON syntax
        run: |
          node -e 'for (const path of [
            "receipts/revenue/FARDARTER-DRIVE-CONTROL-HEAD-V6-18.json",
            "receipts/revenue/FARDARTER-DRIVE-AGGREGATE-RECEIPT-V6-16.json",
            "receipts/revenue/FARDARTER-DRIVE-OWNER-ROUTING-V6-17.json",
            "schemas/revenue/fardarter-drive-control-head-v6-18.schema.json",
            "schemas/revenue/fardarter-drive-aggregate-receipt-v6-16.schema.json",
            "schemas/revenue/fardarter-drive-owner-routing-v6-17.schema.json"
          ]) JSON.parse(require("node:fs").readFileSync(path, "utf8")); console.log("Fardarter Drive v6.18 control-head JSON syntax: PASS")'
