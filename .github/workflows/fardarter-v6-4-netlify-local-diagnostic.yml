name: Fardarter Drive v6.4 Netlify Local Diagnostic

on:
  push:
    branches:
      - deploy/fardarter-v6-4-exact-20260730
    paths:
      - .github/workflows/fardarter-v6-4-netlify-local-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  EXACT_SOURCE_COMMIT: e482004bfff1bb90aba2d67b8da62a524f18cdb4
  NETLIFY_SITE_ID: 21d3bb41-3a69-4a7d-b6c6-e873cde8ee2f
  NETLIFY_NEXT_ADAPTER_VERSION: 5.15.11

jobs:
  diagnose:
    name: Reproduce Netlify adapter build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Publish diagnostic run identity
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = `<!-- FARDARTER-V6-4-NETLIFY-DIAGNOSTIC-START-${context.runId} -->`;
            const body = `${marker}\n\n## Exact v6.4 Netlify diagnostic started\n\n` +
              `- Workflow run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}\n` +
              `- Exact source: \`${process.env.EXACT_SOURCE_COMMIT}\`\n` +
              `- Adapter: \`@netlify/plugin-nextjs@${process.env.NETLIFY_NEXT_ADAPTER_VERSION}\`.`;
            await github.rest.issues.createComment({ owner, repo, issue_number: 136, body });

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check out exact v6.4 source
        uses: actions/checkout@v4
        with:
          ref: e482004bfff1bb90aba2d67b8da62a524f18cdb4
          fetch-depth: 1

      - name: Verify exact source and apply deployment-only adapter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_COMMIT"
          test "$(git hash-object receipts/revenue/FARDARTER-DRIVE-CANONICALIZATION-PREVIEWS-V6-4.json)" = 99a4bb840df5630efdf55d7e5fd4d6bdd0b62996
          test "$(git hash-object receipts/revenue/FARDARTER-DRIVE-CANONICALIZATION-REVIEW-BUNDLE-V6-4.sample.json)" = e55188c34b34dddbe22652442b1ed6d0d932f25b
          test "$(git hash-object receipts/revenue/FARDARTER-DRIVE-GDRIVE-V6.json)" = bd24a05b0372ef77c97d520609baef73d0b778c6
          test "$(git hash-object app/api/revenue/canonicalization-preview/route.ts)" = 95cf068221fd49fc6ddba755f8d47f72dc3da55e
          test "$(git hash-object .github/workflows/fardarter-canonicalization-preview-v6-4.yml)" = 6d2a32710a00bdb2a8fa49275447699fe8e2c7b3
          npm install --package-lock-only --ignore-scripts --save-dev --registry=https://registry.npmjs.org \
            "@netlify/plugin-nextjs@$NETLIFY_NEXT_ADAPTER_VERSION"
          cat >> netlify.toml <<'TOML'

          [[plugins]]
            package = "@netlify/plugin-nextjs"
          TOML
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = $'netlify.toml\npackage-lock.json\npackage.json'
          mkdir -p .netlify artifacts
          printf '{"siteId":"%s"}\n' "$NETLIFY_SITE_ID" > .netlify/state.json

      - name: Install dependencies
        shell: bash
        run: npm ci --include=dev --registry=https://registry.npmjs.org

      - name: Run production command directly
        id: direct
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run service-bridge:check:all 2>&1 | tee artifacts/direct-check.log
          npm run build 2>&1 | tee artifacts/direct-build.log

      - name: Run full Netlify build lifecycle
        id: netlify_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes --registry=https://registry.npmjs.org netlify-cli@latest build --context production --offline 2>&1 | tee artifacts/netlify-build.log

      - name: Inspect generated Netlify output
        if: always()
        shell: bash
        run: |
          {
            echo "DIRECT_OUTCOME=${{ steps.direct.outcome }}"
            echo "NETLIFY_BUILD_OUTCOME=${{ steps.netlify_build.outcome }}"
            echo "--- .netlify files ---"
            find .netlify -maxdepth 5 -type f -printf '%p %s bytes\n' | sort | head -300 || true
            echo "--- functions ---"
            find .netlify -maxdepth 6 -type f | grep -E '/functions/|/edge-functions/' || true
            echo "--- redirects ---"
            find .netlify -type f -name '*redirect*' -o -name '_redirects' | sort || true
          } | tee artifacts/output-inspection.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fardarter-v6-4-netlify-diagnostic-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Publish diagnostic result
        if: always()
        uses: actions/github-script@v7
        env:
          DIRECT_OUTCOME: ${{ steps.direct.outcome }}
          NETLIFY_BUILD_OUTCOME: ${{ steps.netlify_build.outcome }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = `<!-- FARDARTER-V6-4-NETLIFY-DIAGNOSTIC-${context.runId} -->`;
            const body = `${marker}\n\n## Exact v6.4 Netlify local diagnostic\n\n` +
              `- Workflow run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}\n` +
              `- Exact source: \`${process.env.EXACT_SOURCE_COMMIT}\`\n` +
              `- Direct production build: \`${process.env.DIRECT_OUTCOME}\`\n` +
              `- Netlify adapter lifecycle: \`${process.env.NETLIFY_BUILD_OUTCOME}\`\n` +
              `- Diagnostic artifact: \`fardarter-v6-4-netlify-diagnostic-${context.runId}\`.`;
            await github.rest.issues.createComment({ owner, repo, issue_number: 136, body });
