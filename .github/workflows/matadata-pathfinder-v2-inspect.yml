name: MATADATA Pathfinder V2 Source Inspection

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: matadata-pathfinder-v2-source-inspection
  cancel-in-progress: true

jobs:
  reconstruct-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct reviewed source without opening OpenAI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pathfinder-source
          cat tools/matadata-pathfinder/v2/runner.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > pathfinder-source/matadata-pathfinder-v2.cjs
          echo 'f2839e50dbf2e7c2dad64a6e227555c4b9f5c9b29ff45e073a92026e4a561811  pathfinder-source/matadata-pathfinder-v2.cjs' \
            | sha256sum --check
          node --check pathfinder-source/matadata-pathfinder-v2.cjs
          sha256sum pathfinder-source/matadata-pathfinder-v2.cjs > pathfinder-source/SHA256SUMS.txt

      - name: Upload source for acknowledgment-control repair
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v2-source
          path: pathfinder-source
          if-no-files-found: error
          retention-days: 1
