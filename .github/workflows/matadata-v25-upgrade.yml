name: MATADATA Pathfinder V2.5 Upgrade

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: matadata-v25-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    if: github.head_ref == 'agent/matadata-openai-pathfinder-v2-2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the staged Pathfinder branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Make regex replacements literal and apply the V2.5 repair
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/matadata-pathfinder/v25/upgrade.py')
          text = path.read_text(encoding='utf-8')
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if old not in text:
              raise SystemExit('regex_once patch target was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -u tools/matadata-pathfinder/v25/upgrade.py 2>&1 | tee /tmp/matadata-v25-upgrade.log

      - name: Package the verified generated V2.5 files
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/matadata-v25-generated
          mkdir -p "$root/.github/workflows" "$root/tools/matadata-pathfinder/v22"
          cp .github/workflows/matadata-openai-pathfinder-v22.yml "$root/.github/workflows/"
          cp tools/matadata-pathfinder/v22/package.part.* "$root/tools/matadata-pathfinder/v22/"
          cp tools/matadata-pathfinder/v22/MANIFEST.json "$root/tools/matadata-pathfinder/v22/"
          cp tools/matadata-pathfinder/v22/V25_UPGRADE_RECEIPT.json "$root/tools/matadata-pathfinder/v22/"
          tar -C "$root" -czf /tmp/matadata-v25-generated.tar.gz .
          sha256sum /tmp/matadata-v25-generated.tar.gz > /tmp/matadata-v25-generated.tar.gz.sha256

      - name: Preserve upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v25-upgrade-diagnostics
          path: /tmp/matadata-v25-upgrade.log
          if-no-files-found: warn
          retention-days: 1

      - name: Upload verified generated V2.5 files
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v25-generated
          path: |
            /tmp/matadata-v25-generated.tar.gz
            /tmp/matadata-v25-generated.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
