name: MATADATA Pathfinder V2.2 Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: matadata-pathfinder-v22-bootstrap
  cancel-in-progress: true

jobs:
  materialize-reviewed-v22:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/matadata-openai-pathfinder-v2-2-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the staged V2.2 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Materialize and diagnose checksum-locked artifacts
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p tools/matadata-pathfinder/v2.2 .github/workflows /tmp/matadata-v22
          status=0

          cat tools/matadata-pathfinder/v2.2/transport/runner.b64.* \
            | tr -d '[:space:]' \
            | base64 --decode \
            > tools/matadata-pathfinder/v2.2/runner.cjs.gz
          runner_actual="$(sha256sum tools/matadata-pathfinder/v2.2/runner.cjs.gz | awk '{print $1}')"
          if [[ "$runner_actual" != 'c0af8aa0fa65a539e5812de492f332a6cf8a7f347041a5693a769d4046409103' ]]; then status=1; fi

          source_actual='unavailable'
          runner_gzip_valid='false'
          if gzip --test tools/matadata-pathfinder/v2.2/runner.cjs.gz; then
            runner_gzip_valid='true'
            gzip --decompress --stdout tools/matadata-pathfinder/v2.2/runner.cjs.gz > /tmp/matadata-pathfinder-v22.cjs
            source_actual="$(sha256sum /tmp/matadata-pathfinder-v22.cjs | awk '{print $1}')"
            if [[ "$source_actual" != '01bfd573d085b481e501d2077ec5858d5c6b112fbc34c6194d73916e34f407ab' ]]; then status=1; fi
            node --check /tmp/matadata-pathfinder-v22.cjs || status=1
          else
            status=1
          fi

          cat tools/matadata-pathfinder/v2.2/transport/workflow.b64.* \
            | tr -d '[:space:]' \
            | base64 --decode \
            > .github/workflows/matadata-openai-pathfinder-v22.yml
          workflow_actual="$(sha256sum .github/workflows/matadata-openai-pathfinder-v22.yml | awk '{print $1}')"
          if [[ "$workflow_actual" != '34247c64cd73c6ffb9fd53d4eb8910ac06dabd61264f8e8cca32c84b7bbb21ca' ]]; then status=1; fi

          {
            echo 'runner_gzip_expected=c0af8aa0fa65a539e5812de492f332a6cf8a7f347041a5693a769d4046409103'
            echo "runner_gzip_actual=$runner_actual"
            echo "runner_gzip_valid=$runner_gzip_valid"
            echo 'runner_source_expected=01bfd573d085b481e501d2077ec5858d5c6b112fbc34c6194d73916e34f407ab'
            echo "runner_source_actual=$source_actual"
            echo 'workflow_expected=34247c64cd73c6ffb9fd53d4eb8910ac06dabd61264f8e8cca32c84b7bbb21ca'
            echo "workflow_actual=$workflow_actual"
            echo 'RUNNER TRANSPORT CHUNKS'
            wc -c tools/matadata-pathfinder/v2.2/transport/runner.b64.*
            sha256sum tools/matadata-pathfinder/v2.2/transport/runner.b64.*
            echo 'WORKFLOW TRANSPORT CHUNKS'
            wc -c tools/matadata-pathfinder/v2.2/transport/workflow.b64.*
            sha256sum tools/matadata-pathfinder/v2.2/transport/workflow.b64.*
          } | tee /tmp/matadata-v22/bootstrap-diagnostics.txt

          exit "$status"

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v22-bootstrap-diagnostics
          path: /tmp/matadata-v22/bootstrap-diagnostics.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Publish failed transport diagnostics to the staged branch
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/matadata-pathfinder/v2.2
          cp /tmp/matadata-v22/bootstrap-diagnostics.txt tools/matadata-pathfinder/v2.2/BOOTSTRAP_DIAGNOSTICS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/matadata-pathfinder/v2.2/BOOTSTRAP_DIAGNOSTICS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record MATADATA V2.2 transport diagnostics'
          git push origin HEAD:${{ github.head_ref }}

      - name: Remove one-time transport and bootstrap files
        shell: bash
        run: |
          rm -rf tools/matadata-pathfinder/v2.2/transport
          rm -f tools/matadata-pathfinder/v2.2/BOOTSTRAP_DIAGNOSTICS.txt
          rm -f .github/workflows/matadata-pathfinder-v22-bootstrap.yml

      - name: Commit the clean staged V2.2 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialize hardened MATADATA Pathfinder V2.2'
          git push origin HEAD:${{ github.head_ref }}
