name: MATADATA Pathfinder V2.2 Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matadata-pathfinder-v22-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_SHA256: 01bfd573d085b481e501d2077ec5858d5c6b112fbc34c6194d73916e34f407ab
  GZIP_SHA256: c0af8aa0fa65a539e5812de492f332a6cf8a7f347041a5693a769d4046409103
  APPLICATION_SHA256: fda0c9e4f432b330fda80a08f7ee423da16672b1f06afba84e5cb8795d63fb03
  SUBMISSION_ID: matadata-openai-cybersecurity-grant-v1

jobs:
  validate-v22:
    name: Static contract and full-DOM-rerender validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the staged V2.2 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and verify the reviewed runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matadata-v22 pathfinder-validation/static pathfinder-validation/rerender
          cat tools/matadata-pathfinder/v2.2/transport/runner.b64.* \
            | tr -d '[:space:]' \
            | base64 --decode \
            > /tmp/matadata-v22/runner.cjs.gz
          echo "$GZIP_SHA256  /tmp/matadata-v22/runner.cjs.gz" | sha256sum --check
          gzip --test /tmp/matadata-v22/runner.cjs.gz
          gzip --decompress --stdout /tmp/matadata-v22/runner.cjs.gz > /tmp/matadata-v22/runner.cjs
          echo "$RUNNER_SHA256  /tmp/matadata-v22/runner.cjs" | sha256sum --check
          node --check /tmp/matadata-v22/runner.cjs
          sha256sum /tmp/matadata-v22/runner.cjs /tmp/matadata-v22/runner.cjs.gz > pathfinder-validation/SHA256SUMS.txt

      - name: Run static policy and proposal self-tests
        shell: bash
        run: |
          set -euo pipefail
          printf 'module.exports={chromium:{}};\n' > /tmp/matadata-v22/mock-playwright.cjs
          PATHFINDER_SELF_TEST='1' \
          PATHFINDER_TOKEN='offline-static-token-000000000000' \
          PATHFINDER_ARTIFACT_DIR="$GITHUB_WORKSPACE/pathfinder-validation/static" \
          PATHFINDER_SUBMISSION_ID="$SUBMISSION_ID" \
          PLAYWRIGHT_MODULE='/tmp/matadata-v22/mock-playwright.cjs' \
          node /tmp/matadata-v22/runner.cjs
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('pathfinder-validation/static/selftest.json').read_text(encoding='utf-8'))
          required = {
              'field-spec-count',
              'stable-field-names',
              'single-project-title-field',
              'no-ephemeral-field-tags',
              'fresh-resolution-retries',
              'full-value-verification',
              'cookie-reconnect-after-url-cleanup',
              'direct-submit-block',
              'terms-text-only-acknowledgment',
              'field-verification-submit-precondition',
          }
          tests = {item['name']: item['ok'] for item in result.get('tests', [])}
          failed = sorted(name for name in required if tests.get(name) is not True)
          if result.get('passed') is not True or failed:
              raise SystemExit(f'Static V2.2 validation failed: {failed}')
          if result.get('runnerVersion') != '2.2.0':
              raise SystemExit('Unexpected runner version.')
          if result.get('applicationSha256') != 'fda0c9e4f432b330fda80a08f7ee423da16672b1f06afba84e5cb8795d63fb03':
              raise SystemExit('Application content checksum changed.')
          print(json.dumps(result, indent=2))
          PY

      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pathfinder-node /tmp/ms-playwright
          cd /tmp/pathfinder-node
          npm init -y >/dev/null
          PLAYWRIGHT_BROWSERS_PATH=/tmp/ms-playwright npm install --no-audit --no-fund playwright@1.55.0
          PLAYWRIGHT_BROWSERS_PATH=/tmp/ms-playwright npx playwright install --with-deps chromium

      - name: Replace the entire form after field eight and prove recovery
        shell: bash
        run: |
          set -euo pipefail
          PATHFINDER_FIXTURE_TEST='1' \
          PATHFINDER_TOKEN='offline-rerender-token-0000000000' \
          PATHFINDER_ARTIFACT_DIR="$GITHUB_WORKSPACE/pathfinder-validation/rerender" \
          PATHFINDER_SUBMISSION_ID="$SUBMISSION_ID" \
          PLAYWRIGHT_MODULE='/tmp/pathfinder-node/node_modules/playwright' \
          PLAYWRIGHT_BROWSERS_PATH='/tmp/ms-playwright' \
          node /tmp/matadata-v22/runner.cjs
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('pathfinder-validation/rerender/fixture-test.json').read_text(encoding='utf-8'))
          checks = {
              'passed': result.get('passed') is True,
              'fieldCount': result.get('fieldCount') == 13,
              'uniqueIdentities': result.get('uniqueIdentities') == 13,
              'rerenders': result.get('rerenders') == 1,
              'noMismatches': result.get('verificationMismatches') == [],
              'acknowledgmentMode': result.get('acknowledgmentMode') == 'official-terms-text-only',
              'applicationSha256': result.get('applicationSha256') == 'fda0c9e4f432b330fda80a08f7ee423da16672b1f06afba84e5cb8795d63fb03',
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'Dynamic rerender regression failed: {failed}')
          print(json.dumps(result, indent=2))
          PY

      - name: Build a combined validation receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          def load(path):
              p = Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else None
          static = load('pathfinder-validation/static/selftest.json')
          rerender = load('pathfinder-validation/rerender/fixture-test.json')
          receipt = {
              'status': 'PASSED' if static and rerender and static.get('passed') and rerender.get('passed') else 'FAILED',
              'runnerVersion': '2.2.0',
              'submissionId': 'matadata-openai-cybersecurity-grant-v1',
              'runnerSha256': '01bfd573d085b481e501d2077ec5858d5c6b112fbc34c6194d73916e34f407ab',
              'gzipSha256': 'c0af8aa0fa65a539e5812de492f332a6cf8a7f347041a5693a769d4046409103',
              'applicationSha256': 'fda0c9e4f432b330fda80a08f7ee423da16672b1f06afba84e5cb8795d63fb03',
              'static': static,
              'rerender': rerender,
              'liveFormOpened': False,
              'submitClicks': 0,
              'timestamp': datetime.now(timezone.utc).isoformat(),
          }
          Path('pathfinder-validation/VALIDATION_RECEIPT.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload V2.2 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v22-validation
          path: pathfinder-validation
          if-no-files-found: error
          retention-days: 30
