name: Fardarter v6.11 Exact Netlify Recovery Verification

on:
  push:
    branches:
      - deploy/fardarter-v6-11-exact-88bd8dc
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: fardarter-v6-11-exact-promotion
  cancel-in-progress: false

env:
  TARGET_COMMIT: 88bd8dc89a0bd95f42c7e1a21dccc56fe9dc7334
  CONTROL_MERGE: f5d3261bb513764fe14601ef9d0fc53e71ea83b3
  SITE_ID: 21d3bb41-3a69-4a7d-b6c6-e873cde8ee2f
  SITE_NAME: lichburn-v0-2-8
  ISSUE_NUMBER: "194"
  PROVIDER_DEPLOY_RUN: "30572898948"
  DEPLOY_ID: 6a6ba0366ebec6650d843ac3
  IMMUTABLE_URL: https://6a6ba0366ebec6650d843ac3--lichburn-v0-2-8.netlify.app
  ROLLBACK_DEPLOY_ID: 6a6b6a709e0a6d5ff2ca7759
  EXPECTED_PACKAGE_SHA256: d8a876dfc9b5156bef118fae6487c18358c884d4aa326235286152e38dddb104

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Mark recovery start
        shell: bash
        run: |
          echo "recover-exact-provider-package" > /tmp/fardarter-v6-11-step

      - name: Checkout recovery verifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download exact package artifact from provider run
        uses: actions/download-artifact@v4
        with:
          name: fardarter-v6-11-predeploy-30572898948
          path: recovered
          run-id: 30572898948
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and extract exact uploaded package
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "verify-exact-provider-package" > /tmp/fardarter-v6-11-step
          ARCHIVE="$(find recovered -type f -name 'fardarter-v6-11-static-site.tar.gz' -print -quit)"
          test -n "$ARCHIVE"
          ACTUAL_SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_PACKAGE_SHA256"
          mkdir -p site
          tar -C site -xzf "$ARCHIVE"
          test -s site/__fardarter-v6-11-materialization.json
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('site/__fardarter-v6-11-materialization.json', 'utf8'));
          if (manifest.exactTargetCommit !== process.env.TARGET_COMMIT) throw new Error('artifact target commit mismatch');
          if (manifest.fixedSiteId !== process.env.SITE_ID) throw new Error('artifact fixed-site mismatch');
          if (manifest.rollbackDeployId !== process.env.ROLLBACK_DEPLOY_ID) throw new Error('artifact rollback mismatch');
          if (manifest.requiredRouteCount !== 18 || manifest.requiredRoutes.length !== 18) throw new Error('artifact route contract mismatch');
          if (manifest.routes.filter((route) => route.required).length !== 18) throw new Error('artifact required route materialization incomplete');
          NODE

      - name: Verify provider deploy and all 18 immutable routes
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "immutable-18-route-readback" > /tmp/fardarter-v6-11-step
          node scripts/verify-netlify-readback-v6-11.mjs site "$IMMUTABLE_URL" "$DEPLOY_ID" evidence | tee /tmp/fardarter-v6-11-readback-summary.json

      - name: Write provider metadata receipt
        shell: bash
        run: |
          cat > /tmp/fardarter-v6-11-deploy-metadata.json <<EOF
          {
            "provider": "NETLIFY",
            "siteId": "$SITE_ID",
            "siteName": "$SITE_NAME",
            "deployId": "$DEPLOY_ID",
            "immutableUrl": "$IMMUTABLE_URL",
            "providerState": "ready",
            "providerDeployRun": $PROVIDER_DEPLOY_RUN,
            "verificationRun": $GITHUB_RUN_ID,
            "rollbackDeployId": "$ROLLBACK_DEPLOY_ID"
          }
          EOF

      - name: Upload final deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: fardarter-v6-11-deployed-and-verified-${{ github.run_id }}
          path: |
            evidence/FARDARTER-V6-11-NETLIFY-READBACK.json
            evidence/FARDARTER-V6-11-NETLIFY-READBACK.sha256
            site/__fardarter-v6-11-materialization.json
            site/__fardarter-v6-11-materialization.sha256
            /tmp/fardarter-v6-11-deploy-metadata.json
            /tmp/fardarter-v6-11-readback-summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish durable success receipts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const evidence = JSON.parse(fs.readFileSync('evidence/FARDARTER-V6-11-NETLIFY-READBACK.json', 'utf8'));
            const evidenceDigest = fs.readFileSync('evidence/FARDARTER-V6-11-NETLIFY-READBACK.sha256', 'utf8').trim();
            const marker = `<!-- FARDARTER-V6-11-VERIFIED-${process.env.DEPLOY_ID} -->`;
            const body = `${marker}\n\n## Fardarter Drive v6.11 exact production promotion receipt\n\n- Exact application source: \`${process.env.TARGET_COMMIT}\`\n- Control merge: \`${process.env.CONTROL_MERGE}\`\n- Provider upload run: \`${process.env.PROVIDER_DEPLOY_RUN}\`\n- Recovery verification run: \`${context.runId}\`\n- Fixed Netlify site: \`${process.env.SITE_ID}\` / \`${process.env.SITE_NAME}\`\n- Deploy ID: \`${process.env.DEPLOY_ID}\`\n- Immutable deploy URL: ${process.env.IMMUTABLE_URL}\n- Rollback deploy ID: \`${process.env.ROLLBACK_DEPLOY_ID}\`\n- Immutable route readback: **${evidence.verifiedRouteCount}/${evidence.requiredRouteCount} PASS**\n- Exact body matches: **${evidence.exactBodyMatchCount}/${evidence.requiredRouteCount}**\n- Static package SHA-256: \`${process.env.EXPECTED_PACKAGE_SHA256}\`\n- Evidence SHA-256: \`${evidenceDigest}\`\n\nResult: **DEPLOYED_AND_VERIFIED**. Netlify independently reports the provider deploy ready. The exact artifact uploaded in the provider run was recovered without rebuilding and all 18 required routes matched its frozen bodies byte-for-byte from the authoritative immutable URL. No private Google Drive URL or ID was exposed. The prior verified deployment remains the rollback anchor.\n\nCanonical and commercial state remains sequence 1, HUMAN_ACCEPTED=0, ACTIVE=0, orders=0, verified gross revenue=$0, and verified settled cash=$0.`;
            for (const issue_number of [194, 192, 190, 141, 133]) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
              });
              if (!comments.some((comment) => comment.body?.includes(marker))) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  body,
                });
              }
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 194,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Publish exact recovery failure receipt
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const step = fs.existsSync('/tmp/fardarter-v6-11-step')
              ? fs.readFileSync('/tmp/fardarter-v6-11-step', 'utf8').trim()
              : 'unknown-step';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `<!-- FARDARTER-V6-11-RECOVERY-FAIL-${context.runId} -->\n\n## Exact v6.11 recovery verification failure\n\n- Provider deploy ID: \`${process.env.DEPLOY_ID}\`\n- Immutable URL: ${process.env.IMMUTABLE_URL}\n- Exact target: \`${process.env.TARGET_COMMIT}\`\n- Failing step: \`${step}\`\n- Rollback deploy preserved: \`${process.env.ROLLBACK_DEPLOY_ID}\`\n\nProvider state may be ready, but promotion remains **NOT_VERIFIED** until all 18 immutable route checks pass.`,
            });
