name: Armitron Clock Rail P3 Verify

on:
  pull_request:
    paths:
      - 'tools/armitron/**'
      - 'tools/browser-bridge/p1/armitron-browser.mjs'
      - 'tools/gmail-bridge/p2/armitron-email.mjs'
      - 'scripts/check-armitron-clock-p3.mjs'
      - 'docs/armitron/**'
      - '.github/workflows/armitron-clock-p3-verify.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Armitron registry, truth boundaries, receipts, and wrappers
        run: node scripts/check-armitron-clock-p3.mjs

      - name: Exercise browser lane help through Armitron
        run: node tools/browser-bridge/p1/armitron-browser.mjs help

      - name: Exercise email lane help through Armitron
        run: node tools/gmail-bridge/p2/armitron-email.mjs help

      - name: Build application through GitHub Armitron lane
        run: node tools/armitron/v23/armitron-wrap.mjs --lane github --clock atomic -- npm run build

      - name: Upload Armitron verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: armitron-clock-p3-verification
          path: |
            armitron-p3-verification.json
            .armitron/receipts/armitron-v23.jsonl
          if-no-files-found: error
          retention-days: 30
