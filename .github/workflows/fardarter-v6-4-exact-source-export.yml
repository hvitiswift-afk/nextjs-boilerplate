name: Fardarter Drive v6.4 Exact Source Export

on:
  push:
    branches:
      - deploy/fardarter-v6-4-exact-20260730
    paths:
      - .github/workflows/fardarter-v6-4-exact-source-export.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fardarter-v6-4-exact-source-export
  cancel-in-progress: true

env:
  EXACT_SOURCE_COMMIT: e482004bfff1bb90aba2d67b8da62a524f18cdb4

jobs:
  export:
    name: Export exact merged v6.4 source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: e482004bfff1bb90aba2d67b8da62a524f18cdb4
          fetch-depth: 1

      - name: Verify exact commit and locked blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_COMMIT"
          check_blob() {
            local path="$1" expected="$2" actual
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || { echo "Blob mismatch for $path: expected $expected, got $actual"; exit 1; }
          }
          check_blob receipts/revenue/FARDARTER-DRIVE-CANONICALIZATION-PREVIEWS-V6-4.json 99a4bb840df5630efdf55d7e5fd4d6bdd0b62996
          check_blob receipts/revenue/FARDARTER-DRIVE-CANONICALIZATION-REVIEW-BUNDLE-V6-4.sample.json e55188c34b34dddbe22652442b1ed6d0d932f25b
          check_blob receipts/revenue/FARDARTER-DRIVE-GDRIVE-V6.json bd24a05b0372ef77c97d520609baef73d0b778c6
          check_blob app/api/revenue/canonicalization-preview/route.ts 95cf068221fd49fc6ddba755f8d47f72dc3da55e
          check_blob .github/workflows/fardarter-canonicalization-preview-v6-4.yml 6d2a32710a00bdb2a8fa49275447699fe8e2c7b3

      - name: Create deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git archive --format=tar.gz --prefix=nextjs-boilerplate-e482004/ \
            --output=export/fardarter-v6-4-exact-source.tar.gz "$EXACT_SOURCE_COMMIT"
          sha256sum export/fardarter-v6-4-exact-source.tar.gz > export/fardarter-v6-4-exact-source.tar.gz.sha256
          printf '%s\n' "$EXACT_SOURCE_COMMIT" > export/source-commit.txt

      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: fardarter-v6-4-exact-source-${{ github.run_id }}
          path: export
          if-no-files-found: error
          retention-days: 7

      - name: Publish source-export receipt
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = `<!-- FARDARTER-V6-4-SOURCE-EXPORT-${context.runId} -->`;
            const body = `${marker}\n\n## Exact v6.4 source export ready\n\n` +
              `- Source commit: \`${process.env.EXACT_SOURCE_COMMIT}\`\n` +
              `- Workflow run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}\n` +
              `- Artifact: \`fardarter-v6-4-exact-source-${context.runId}\`\n` +
              `- Export includes only tracked files from the exact commit via \`git archive\`.\n` +
              `- Locked blob verification: **PASS**.`;
            for (const issue_number of [136, 143]) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              if (!comments.some((comment) => comment.body?.includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }
