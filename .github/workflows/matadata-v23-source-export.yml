name: MATADATA V2.3 Source Export

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: matadata-v23-source-export
  cancel-in-progress: true

jobs:
  export:
    if: github.head_ref == 'agent/matadata-openai-pathfinder-v2-2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct reviewed V2.3 package without opening OpenAI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matadata-v23 matadata-v23-source
          cat tools/matadata-pathfinder/v22/package.part.* > /tmp/matadata-v23/package.tar.gz
          echo 'ea5d0589225f4a7e6ac9fc177f90ec15e33b732e14c9ce2b1bf6ae8270336241  /tmp/matadata-v23/package.tar.gz' | sha256sum --check
          tar -xzf /tmp/matadata-v23/package.tar.gz -C /tmp/matadata-v23
          gzip --decompress --stdout /tmp/matadata-v23/runner.cjs.gz > matadata-v23-source/runner.cjs
          echo 'defc4b0e311d7a68e9e12d7464b6959fd1538b240bf98a7c073e521a169f6a4e  matadata-v23-source/runner.cjs' | sha256sum --check
          node --check matadata-v23-source/runner.cjs
          cp -a /tmp/matadata-v23/scripts matadata-v23-source/
          cp /tmp/matadata-v23/MANIFEST.json matadata-v23-source/ 2>/dev/null || true
          sha256sum matadata-v23-source/runner.cjs matadata-v23-source/scripts/* > matadata-v23-source/SHA256SUMS.txt

      - name: Upload V2.3 source for newline-normalization repair
        uses: actions/upload-artifact@v4
        with:
          name: matadata-pathfinder-v23-source
          path: matadata-v23-source
          if-no-files-found: error
          retention-days: 1
