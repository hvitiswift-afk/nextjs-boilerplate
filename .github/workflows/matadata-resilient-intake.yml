name: MATADATA Resilient Intake

on:
  push:
    branches: [main]
    paths:
      - "lib/intake/**"
      - "scripts/check-resilient-intake.mjs"
      - "docs/matadata/**"
      - "examples/matadata-resilient-intake.sample.json"
      - "package.json"
      - ".github/workflows/matadata-resilient-intake.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/intake/**"
      - "scripts/check-resilient-intake.mjs"
      - "docs/matadata/**"
      - "examples/matadata-resilient-intake.sample.json"
      - "package.json"
      - ".github/workflows/matadata-resilient-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matadata-resilient-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run stable-schema, rerender, acknowledgment, idempotency, and receipt checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run intake:check 2>&1 | tee artifacts/matadata-resilient-intake-check.txt
          cp artifacts/matadata-resilient-intake-check.txt artifacts/matadata-resilient-intake-check.json
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("artifacts/matadata-resilient-intake-check.json","utf8")); if(r.status!=="PASS") process.exit(1); console.log(`verified ${r.uniqueFieldCount} stable fields; receipt head ${r.receiptChain.head}`)'

      - name: Upload verification receipt or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matadata-resilient-intake-receipt
          path: artifacts
          if-no-files-found: error
          retention-days: 30
