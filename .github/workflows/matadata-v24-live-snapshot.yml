name: MATADATA V2.4 Live Validation Snapshot

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: matadata-v24-live-validation-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.head_ref == 'agent/matadata-openai-pathfinder-v2-2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '30236469295'
    steps:
      - uses: actions/checkout@v4

      - name: Download the active V2.4 handoff without exposing its token
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v24-session /tmp/v24-snapshot
          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "matadata-pathfinder-v24-live-session") | .id' | head -n1)"
          test -n "$artifact_id"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/v24-session/session.zip
          unzip -q /tmp/v24-session/session.zip -d /tmp/v24-session/content

      - name: Fetch and sanitize the current V2.4 page and status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/v24-session/url.txt
          import json
          from pathlib import Path
          files = list(Path('/tmp/v24-session/content').rglob('*.json'))
          if not files:
              raise SystemExit('No session JSON found.')
          payload = json.loads(files[0].read_text(encoding='utf-8'))
          for key in ('primary_url', 'url', 'primaryUrl'):
              if payload.get(key):
                  print(payload[key])
                  break
          else:
              raise SystemExit('No primary URL in handoff.')
          PY
          url="$(cat /tmp/v24-session/url.txt)"
          base="${url%%\?*}"
          curl --fail --location --silent --show-error --max-time 25 --cookie-jar /tmp/v24-session/cookies.txt --cookie /tmp/v24-session/cookies.txt "$url" > /tmp/v24-session/page.html
          curl --fail --location --silent --show-error --max-time 25 --cookie /tmp/v24-session/cookies.txt "${base%/}/status" > /tmp/v24-session/status.json

          python - <<'PY'
          from html import unescape
          from pathlib import Path
          import hashlib, json, re

          def redact_text(value: str) -> str:
              value = re.sub(r'https://[-a-z0-9]+\.trycloudflare\.com', 'https://<redacted>.trycloudflare.com', value, flags=re.I)
              value = re.sub(r'(?i)(token=)[A-Za-z0-9]+', r'\1<redacted>', value)
              value = re.sub(r'\b[0-9a-fA-F]{24,}\b', '<redacted-hex>', value)
              value = re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '<redacted-email>', value)
              return value

          sensitive = {'token','screenToken','sessionToken','cookie','email','linkedin','application','proposal','problem','timeline','funding','personnel','additionalNotes'}
          def sanitize(value, key=''):
              if key in sensitive:
                  if isinstance(value, str):
                      return f'<redacted:{key}:length={len(value)}:sha256={hashlib.sha256(value.encode()).hexdigest()}>'
                  return f'<redacted:{key}>'
              if isinstance(value, dict):
                  return {k: sanitize(v, k) for k, v in value.items()}
              if isinstance(value, list):
                  return [sanitize(v, key) for v in value]
              if isinstance(value, str):
                  return redact_text(value)
              return value

          raw_status = Path('/tmp/v24-session/status.json').read_text(encoding='utf-8', errors='replace')
          try:
              status = json.loads(raw_status)
              Path('/tmp/v24-snapshot/status-snapshot.json').write_text(json.dumps(sanitize(status), indent=2) + '\n', encoding='utf-8')
          except Exception as exc:
              Path('/tmp/v24-snapshot/status-snapshot.txt').write_text(redact_text(raw_status) + f'\nJSON parse error: {exc}\n', encoding='utf-8')

          html = Path('/tmp/v24-session/page.html').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'<script\b[^>]*>.*?</script>', ' ', html, flags=re.I|re.S)
          text = re.sub(r'<style\b[^>]*>.*?</style>', ' ', text, flags=re.I|re.S)
          text = re.sub(r'<[^>]+>', '\n', text)
          text = unescape(text)
          lines = [re.sub(r'\s+', ' ', line).strip() for line in text.splitlines()]
          lines = [line for line in lines if line]
          keywords = re.compile(r'error|failed|timeout|status|phase|message|acknowledg|submit|validation|field|revision|connected|session|mismatch', re.I)
          selected = [redact_text(line) for line in lines if keywords.search(line)] or [redact_text(line) for line in lines[:120]]
          Path('/tmp/v24-snapshot/page-visible-status.txt').write_text('\n'.join(selected[:240]) + '\n', encoding='utf-8')
          Path('/tmp/v24-snapshot/page-html-sha256.txt').write_text(hashlib.sha256(html.encode()).hexdigest() + '\n', encoding='utf-8')
          PY

      - name: Upload sanitized V2.4 validation snapshot
        uses: actions/upload-artifact@v4
        with:
          name: matadata-v24-live-validation-snapshot
          path: /tmp/v24-snapshot
          if-no-files-found: error
          retention-days: 1
