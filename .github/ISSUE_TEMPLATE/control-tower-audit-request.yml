name: Control Tower Audit Request
description: Request a fixed-scope GitHub repository operations audit using public-safe information only.
title: "[Audit request]: "
body:
  - type: markdown
    attributes:
      value: |
        This public issue is a fit-check request. A qualifying exact-prefix request may automatically enter **FIT_APPROVED_FOR_SCOPE_DRAFT**, receive bounded labels and one receipt, and trigger preparation of a private Google Drive work package. That state is nonbinding: it is not an order, capacity reservation, contract, signature, invoice, payment request, deadline, indemnity agreement, waiver, release, or work start. Do not post credentials, payment records, private customer information, protected health information, confidential records, bank or payout data, provider transaction IDs, signatures, or counsel notes.

  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: Provide the GitHub repository to review. It must be public or accessible through a separately authorized read-only path.
      placeholder: "https://github.com/owner/repository"
    validations:
      required: true

  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship to the repository
      options:
        - Owner or administrator
        - Maintainer or authorized contributor
        - Client representative with authority to request review
        - Evaluating fit before obtaining authority
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Current operating problem
      description: Describe what is difficult today, such as stale pull requests, duplicate issues, unclear checks, blocked deployment, or uncertain priorities.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State what should be clearer or more actionable after the audit.
    validations:
      required: true

  - type: textarea
    id: priorities
    attributes:
      label: Priority branches, pull requests, issues, or workflows
      description: List public-safe references that should receive attention first.

  - type: dropdown
    id: size
    attributes:
      label: Approximate review size
      options:
        - Up to 10 open pull requests and 25 open issues
        - Up to 25 open pull requests and 50 open issues
        - Larger than the published scope
        - Not sure
    validations:
      required: true

  - type: input
    id: timing
    attributes:
      label: Timing or deadline
      description: Provide a real deadline or write "no fixed deadline." No deadline is promised until final written acceptance, active delivery capacity, and settlement evidence are confirmed.
      placeholder: "No fixed deadline"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Package being considered
      options:
        - $100 USD Control Tower Audit
        - $250 USD Implementation Pack after audit
        - Audit first; implementation undecided
        - Fit check only
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Public, automation, Google Drive, and transaction boundaries
      options:
        - label: I have not posted credentials, payment records, private customer data, protected health information, confidential records, bank or payout data, provider transaction IDs, signatures, or counsel notes.
          required: true
        - label: I understand that this public request does not create an order, capacity reservation, contract, invoice, payment obligation, deadline, indemnity agreement, waiver, release, or work start.
          required: true
        - label: I understand that automation may approve fit for nonbinding scope drafting, but cannot accept the final commercial agreement, confirm payment, choose liability terms, or start paid work.
          required: true
        - label: I understand that a private Google Drive work package may be prepared after fit approval, but a folder or document is not a signature, contract, payment, settlement receipt, or paid work start.
          required: true
        - label: I understand that the planning envelope is 100 total slots with no more than 10 ACTIVE deliveries, and new work starts pause at the active limit.
          required: true
        - label: I understand that payment and settlement are confirmed only through an agreed external provider, not GitHub labels, comments, stars, reactions, pledges, invoices, Drive files, pending transfers, or screenshots.
          required: true
        - label: I understand that refunds, disputes, admissions, bank or payout changes, billing, domains, credentials, access controls, and destructive actions remain separately approved and evidenced.
          required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional public-safe context
      description: Add anything else needed for the fit check without including sensitive or confidential information.
