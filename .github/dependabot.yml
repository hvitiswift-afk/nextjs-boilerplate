version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Detroit
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automated
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Detroit
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - automated
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
